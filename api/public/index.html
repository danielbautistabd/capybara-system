const normHeader = (s) => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

function guessMapping(headers) {
  const out = {}, used = new Set();
  // 1) coincidencia exacta; 2) el encabezado contiene un sinónimo largo
  for (const pass of [1, 2]) {
    for (const h of headers) {
      if (out[h] !== undefined) continue;
      const n = normHeader(h); if (!n) { out[h] = ''; continue; }
      let hit = '';
      for (const [f, list] of Object.entries(SYN)) {
        if (used.has(f)) continue;
        if (pass === 1 ? list.includes(n) : list.some((x) => x.length >= 5 && n.includes(x))) { hit = f; break; }
      }
      if (hit) { out[h] = hit; used.add(hit); } else if (pass === 2) out[h] = '';
    }
  }
  return out;
}

/** Primera fila con al menos 2 encabezados reconocibles (o la primera no vacía) */
function findHeaderRow(matrix) {
  let firstNonEmpty = -1;
  for (let i = 0; i < Math.min(matrix.length, 15); i++) {
    const r = (matrix[i] || []).map((x) => String(x ?? '').trim());
    if (r.filter(Boolean).length === 0) continue;
    if (firstNonEmpty < 0) firstNonEmpty = i;
    const m = guessMapping(r.filter(Boolean));
    if (Object.values(m).filter(Boolean).length >= 2) return i;
  }
  return Math.max(0, firstNonEmpty);
}

/** "$ 3.200", "3.200,50", "3,200.50", 3200 → número. Formato colombiano por defecto. */
function parseNumber(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return Number.isFinite(v) ? v : NaN;
  let s = String(v).trim().replace(/[$\sCOP]/gi, '');
  if (!s) return null;
  const hasDot = s.includes('.'), hasComma = s.includes(',');
  if (hasDot && hasComma) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (hasComma) s = /^-?\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.');
  else if (hasDot && /^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}

/** Date, número serial de Excel, dd/mm/aaaa o aaaa-mm-dd → "aaaa-mm-dd" */
function parseDate(v) {
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  if (typeof v === 'number' && v > 20000 && v < 80000) return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})$/); if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  return 'invalid';
}
const KIND = { consumible: 'consumible', insumo: 'consumible', menaje: 'menaje', lenceria: 'menaje', utensilio: 'menaje', activo: 'activo', equipo: 'activo', mobiliario: 'activo', mueble: 'activo', servicio: 'servicio' };
const STATUS = { activo: 'activo', si: 'activo', 'sí': 'activo', '1': 'activo', true: 'activo', inactivo: 'inactivo', no: 'inactivo', '0': 'inactivo', false: 'inactivo' };

function normalizeRow(raw, mapping) {
  const d = {}, errors = [], warnings = [];
  for (const [col, field] of Object.entries(mapping)) {
    if (!field) continue;
    const v = raw[col];
    if (v === '' || v === null || v === undefined) continue;
    if (['stock', 'stockMin', 'stockMax', 'avgCost', 'lastPrice', 'salePrice', 'packSize'].includes(field)) {
      const n = parseNumber(v);
      if (Number.isNaN(n)) errors.push(`${IMPORT_FIELDS[field]} no es un número: "${v}"`);
      else if (n < 0) errors.push(`${IMPORT_FIELDS[field]} no puede ser negativo`);
      else if (n !== null) d[field] = n;
    } else if (field === 'expiresAt') {
      const dt = parseDate(v); if (dt === 'invalid') errors.push(`Fecha de vencimiento no válida: "${v}"`); else if (dt) d[field] = dt;
    } else if (field === 'kind') {
      const k = KIND[normHeader(v).split(' ')[0]]; if (k) d.kind = k; else warnings.push(`Tipo "${v}" no reconocido: se usa consumible`);
    } else if (field === 'status') {
      const s = STATUS[normHeader(v)] ?? STATUS[String(v).toLowerCase()]; if (s) d.status = s; else warnings.push(`Estado "${v}" no reconocido`);
    } else if (field === 'aliases') d.aliases = String(v).split(/[,;|]/).map((x) => x.trim()).filter(Boolean);
    else d[field] = String(v).trim();
  }
  if (d.code) d.code = d.code.toUpperCase();
  if (d.barcode) d.barcode = String(d.barcode).replace(/\.0$/, '');
  return { d, errors, warnings };
}

const CMP_FIELDS = ['barcode', 'name', 'description', 'category', 'kind', 'unit', 'stockMin', 'stockMax', 'avgCost', 'lastPrice', 'salePrice', 'supplierId', 'location', 'expiresAt', 'aliases', 'packSize', 'status', 'notes'];
const same = (a, b) => (Array.isArray(a) || Array.isArray(b) ? JSON.stringify([...(a || [])].sort()) === JSON.stringify([...(b || [])].sort()) : String(a ?? '') === String(b ?? '') || (typeof a === 'number' && Number(b) === a));

/**
 * @param o.rows        [{__row: n, <encabezado>: valor}]
 * @param o.mapping     {encabezado: campo}
 * @param o.products    catálogo actual
 * @param o.suppliers   proveedores actuales
 * @param o.stockOf     (p) => stock teórico
 * @param o.options     { matchBy: ['code','barcode','name'], stockMode: 'ignorar'|'conteo'|'ajuste', updateAvgCost: false, createSuppliers: true, defaultCategory: 'Otros' }
 */
function buildImportPlan({ rows, mapping, products, suppliers = [], stockOf = () => 0, options = {} }) {
  const opt = { matchBy: ['code', 'barcode', 'name'], stockMode: 'conteo', updateAvgCost: false, createSuppliers: true, defaultCategory: 'Otros', ...options };
  const norm = (s) => normHeader(s);
  const byCode = new Map(products.filter((p) => p.code).map((p) => [String(p.code).toUpperCase(), p]));
  const byBar = new Map(products.filter((p) => p.barcode).map((p) => [String(p.barcode), p]));
  const byName = new Map(products.map((p) => [norm(p.name), p]));
  const supByName = new Map(suppliers.map((s) => [norm(s.name), s]));
  const seen = new Map();
  const items = [];
  const newSuppliers = new Set();
  for (const raw of rows) {
    const { d, errors, warnings } = normalizeRow(raw, mapping);
    if (!Object.keys(d).length) continue; // fila vacía
    let p = null, matchedBy = null;
    for (const k of opt.matchBy) {
      if (k === 'code' && d.code && byCode.get(d.code)) { p = byCode.get(d.code); matchedBy = 'código'; break; }
      if (k === 'barcode' && d.barcode && byBar.get(d.barcode)) { p = byBar.get(d.barcode); matchedBy = 'código de barras'; break; }
      if (k === 'name' && d.name && byName.get(norm(d.name))) { p = byName.get(norm(d.name)); matchedBy = 'nombre'; break; }
    }
    const key = p?.id || d.code || norm(d.name || '');
    if (key && seen.has(key)) errors.push(`Repetido: también está en la fila ${seen.get(key)}`);
    else if (key) seen.set(key, raw.__row);
    if (d.supplier) {
      const s = supByName.get(norm(d.supplier));
      if (s) d.supplierId = s.id;
      else if (opt.createSuppliers) { d.newSupplier = d.supplier; newSuppliers.add(d.supplier); warnings.push(`Se creará el proveedor "${d.supplier}"`); }
      else warnings.push(`Proveedor "${d.supplier}" no existe: se deja sin proveedor`);
    }
    delete d.supplier;
    if (d.code && p && p.code && String(p.code).toUpperCase() !== d.code && matchedBy !== 'código') warnings.push(`El código del archivo (${d.code}) es distinto al del sistema (${p.code}); se conserva el del sistema`);

    if (!p) {
      if (!d.name) errors.push('Falta el nombre del producto');
      if (!d.code) warnings.push('Sin código interno: se asignará uno');
      if (!d.category) { d.category = opt.defaultCategory; warnings.push(`Sin categoría: se usa "${opt.defaultCategory}"`); }
      if (!d.unit) d.unit = 'unidad';
      if (!d.kind) d.kind = 'consumible';
      if (d.avgCost == null && d.lastPrice != null) d.avgCost = d.lastPrice;
      if (d.lastPrice == null && d.avgCost != null) d.lastPrice = d.avgCost;
      items.push({ row: raw.__row, action: errors.length ? 'error' : 'nuevo', productId: null, data: d, changes: Object.entries(d).filter(([k]) => IMPORT_FIELDS[k] || k === 'supplierId').map(([k, v]) => ({ field: k, label: IMPORT_FIELDS[k] || 'Proveedor', from: null, to: v })), stock: d.stock != null ? { from: null, to: d.stock } : null, errors, warnings, matchedBy: null });
      continue;
    }
    const changes = [];
    for (const f of CMP_FIELDS) {
      if (d[f] === undefined) continue;
      if (f === 'avgCost' && !opt.updateAvgCost) { if (!same(p[f], d[f])) warnings.push('Costo promedio distinto: no se cambia (actívalo en opciones si es intencional)'); continue; }
      if (f === 'name' && norm(p.name) === norm(d.name)) continue; // mismo nombre con otras mayúsculas o tildes
      if (!same(p[f], d[f])) changes.push({ field: f, label: IMPORT_FIELDS[f] || 'Proveedor', from: f === 'supplierId' ? suppliers.find((s) => s.id === p[f])?.name || null : p[f] ?? null, to: f === 'supplierId' ? suppliers.find((s) => s.id === d[f])?.name : d[f] });
    }
    if (d.newSupplier) changes.push({ field: 'newSupplier', label: 'Proveedor', from: suppliers.find((s) => s.id === p.supplierId)?.name || null, to: d.newSupplier + ' (nuevo)' });
    let stock = null;
    if (d.stock != null && opt.stockMode !== 'ignorar') {
      const cur = stockOf(p);
      if (Math.abs(cur - d.stock) > 1e-9) stock = { from: cur, to: d.stock, diff: d.stock - cur, mode: opt.stockMode };
    }
    const action = errors.length ? 'error' : changes.length || stock ? 'actualizar' : 'sin_cambios';
    items.push({ row: raw.__row, action, productId: p.id, productName: p.name, productCode: p.code, data: d, changes, stock, errors, warnings, matchedBy });
  }
  const totals = items.reduce((a, i) => ((a[i.action] = (a[i.action] || 0) + 1), a), { nuevo: 0, actualizar: 0, sin_cambios: 0, error: 0 });
  return { items, totals, newSuppliers: [...newSuppliers] };
}

/** Siguiente código libre para una categoría: ALI-007, BEB-012… */
function nextCode(category, products) {
  const pre = normHeader(category).replace(/\s/g, '').slice(0, 3).toUpperCase() || 'PRD';
  let max = 0;
  for (const p of products) { const m = String(p.code || '').match(new RegExp(`^${pre}-(\\d+)$`)); if (m) max = Math.max(max, +m[1]); }
  return `${pre}-${String(max + 1).padStart(3, '0')}`;
}

    else if (status === 'duplicado') { mvs.forEach((m) => (m.status = 'duplicado')); it.status = 'duplicado'; }

/** Pipeline de un mensaje de WhatsApp (equivalente al webhook del backend) */
function ingestMessage(r, { silent = false } = {}) {
  const it = { id: uid('wa'), waId: 'wamid.' + Math.random().toString(36).slice(2, 12), status: 'pendiente_analisis', ...r };
  S.inbox.unshift(it);
  const text = r.transcript || r.text || '';
  let analysis;
  if (r.doc && r.doc.movementHint === 'gasto') {
    analysis = { type: 'gasto', items: [], confidence: r.doc.confidence, document: r.doc };
    it.analysis = analysis; it.confidence = r.doc.confidence; it.status = 'pendiente_aprobacion';
    return it;
  }
  if (r.doc) {
    analysis = { type: 'entrada', area: null, document: r.doc, items: r.doc.items.map((d) => { const p = parseInstruction(`${d.qty} ${d.description}`, catalogForParser()).items[0] || {}; return { ...p, qty: d.qty, unitCost: d.unitPrice, confidence: Math.min(p.confidence || 0.3, r.doc.confidence) }; }) };
  } else analysis = parseInstruction(text, catalogForParser());
  analysis.confidence = analysis.items.length ? Math.min(...analysis.items.map((i) => i.confidence)) : 0;
  it.analysis = analysis; it.confidence = analysis.confidence;
  const src = r.type === 'image' || r.type === 'document' ? 'whatsapp_foto' : r.type === 'audio' ? 'whatsapp_audio' : 'whatsapp';
  const created = [];
  for (const x of analysis.items.filter((i) => i.productId)) {
    created.push(act.addMovement({ productId: x.productId, qty: x.qty, unit: x.unit, type: analysis.type, unitCost: x.unitCost, ts: r.ts, source: src, area: analysis.area, user: r.from, reason: 'Reporte por WhatsApp', evidence: r.type !== 'text' ? r.type : 'wa-msg', confidence: x.confidence, inboxId: it.id, invoice: r.doc?.invoiceNumber, notes: `"${text}"` }, { silent: true }));
  }
  if (!analysis.items.length || analysis.items.some((i) => !i.productId)) it.status = created.length ? 'pendiente_aprobacion' : 'requiere_info';
  else if (created.every((m) => m.status === 'duplicado')) it.status = 'duplicado';
  else it.status = 'pendiente_aprobacion';
  if (S.settings.autoApply && it.status === 'pendiente_aprobacion' && analysis.confidence >= S.settings.threshold) act.inboxStatus(it.id, 'aprobado', { silent: true });
  if (!silent) log('whatsapp.recibir', `${r.from}: "${text.slice(0, 60)}" → ${INBOX_ST[it.status][0]}`);
  return it;
}

/* ---------------- Google Sheets (vista previa local, misma lógica que el backend) ---------------- */
function sheetHash(arr) { let h = 2166136261; const s = JSON.stringify(arr); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return 'h' + (h >>> 0).toString(16); }
function previewSheet() {
  const sh = S.sheet; const out = []; const stats = { leidas: sh.rows.length, nuevas: 0, modificadas: 0, sinCambios: 0, errores: 0, coincidenWhatsApp: 0, duplicadas: 0 };
  sh.rows.forEach((row, i) => {
    const raw = Object.fromEntries(sh.headers.map((h, j) => [h, row[j]]));
    const hsh = sheetHash(row);
    const prev = sh.imported[i];
    if (prev === hsh) { stats.sinCambios++; return; }
    const state = prev ? 'modificado' : 'nuevo'; stats[prev ? 'modificadas' : 'nuevas']++;
    const m = {}; for (const [col, f] of Object.entries(sh.mapping)) if (f) m[f] = raw[col];
    const issues = [];
    const match = m.product ? matchProduct(String(m.product), catalogForParser()) : null;
    if (!match) issues.push(`Producto no reconocido: "${m.product}"`);
    const qty = Number(String(m.qty).replace(',', '.'));
    if (!Number.isFinite(qty) || qty <= 0) issues.push(`Cantidad inválida: "${m.qty}"`);
    const ts = new Date(String(m.ts).replace(' ', 'T'));
    if (isNaN(ts)) issues.push('Fecha inválida');
    let dups = [];
    const type = MOVEMENT_TYPES[m.type] ? m.type : 'marchado';
    if (match && !issues.length) dups = findDuplicates({ productId: match.product.id, type, qty, ts: ts.toISOString(), source: 'sheets', invoice: m.invoice }, S.movements.filter((x) => ['aprobado', 'pendiente', 'duplicado'].includes(x.status)), S.settings.windowH);
    if (dups.some((d) => String(d.b.source).startsWith('whatsapp'))) stats.coincidenWhatsApp++;
    if (dups[0]?.score >= 0.9) stats.duplicadas++;
    if (issues.length) stats.errores++;
    out.push({ i, rowNumber: i + 2, state, raw, hash: hsh, mapped: { ...m, qty, type, ts: isNaN(ts) ? null : ts.toISOString() }, product: match ? { id: match.product.id, name: match.product.name, score: match.score } : null, issues, dups: dups.slice(0, 2).map((d) => ({ id: d.b.id, source: d.b.source, reason: d.reason, score: d.score, status: d.b.status })),
      action: issues.length ? 'revisar' : dups[0]?.score >= 0.9 ? 'vincular' : 'crear' });
  });
  sh.preview = { ts: new Date().toISOString(), stats, rows: out };
  sh.history.unshift({ ts: sh.preview.ts, trigger: 'manual', stats });
  log('sheets.consultar', `${sh.file.name} / ${sh.tab}: ${stats.nuevas} nuevas, ${stats.modificadas} modificadas, ${stats.errores} con error`);
  return sh.preview;
}
function applySheet(decisions) {
  const sh = S.sheet; let created = 0, linked = 0, ignored = 0;
  for (const d of decisions) {
    const r = sh.preview.rows.find((x) => x.i === d.i); if (!r) continue;
    if (d.action === 'ignorar') { ignored++; sh.imported[r.i] = r.hash; continue; }
    if (d.action === 'vincular' && r.dups[0]) {
      const m = S.movements.find((x) => x.id === r.dups[0].id);
      if (m) { m.importRef = `${sh.file.name}!${sh.tab}:${r.rowNumber}`; if (m.status === 'pendiente') act.approve(m.id, {}, { silent: true }); }
      linked++; sh.imported[r.i] = r.hash; continue;
    }
    const pid = d.productId || r.product?.id; if (!pid) continue;
    act.addMovement({ productId: pid, qty: r.mapped.qty, type: r.mapped.type, ts: r.mapped.ts, source: 'sheets', area: r.mapped.area, user: r.mapped.responsible, invoice: r.mapped.invoice || null, unitCost: Number(r.mapped.unitCost) || undefined, reason: 'Importado de Google Sheets', importRef: `${sh.file.name}!${sh.tab}:${r.rowNumber}`, raw: r.raw }, { approve: d.approve, silent: true });
    created++; sh.imported[r.i] = r.hash;
  }
  sh.preview.rows = sh.preview.rows.filter((r) => sh.imported[r.i] !== r.hash);
  S.lastSync = new Date().toISOString();
  log('sheets.aplicar', `${created} creados, ${linked} vinculados a movimientos existentes, ${ignored} ignorados`);
  return { created, linked, ignored };
}

function runRecon() {

  const ts = Object.entries(bySrc).sort((a, b) => b[1] - a[1]);
  chart('c-src', { type: 'doughnut', data: { labels: ts.map((x) => SOURCES[x[0]] || x[0]), datasets: [{ data: ts.map((x) => x[1]), backgroundColor: ts.map((_, i) => C[i % C.length]), spacing: 2, hoverOffset: 4 }] }, options: { cutout: '72%', interaction: { mode: 'nearest', intersect: true }, plugins: { legend: { position: 'bottom', align: 'center' } } }, plugins: [centerText('movimientos', num(ts.reduce((a, x) => a + x[1], 0)))] });

async function syncAndReconcile() {
  const b = $('#sync-btn'); b.classList.add('spin'); b.disabled = true;
  try {
    let summary;
    if (S.settings.mode === 'api') {
      const r = await remote.req('/api/v1/sync-and-reconcile', { method: 'POST' });
      await remote.load();
      S.recon = { ts: new Date().toISOString(), ...r.reconciliation };
      summary = { sheets: r.sheets.reduce((a, s) => a + (s.pendientes || 0), 0), wa: r.whatsappPending, recon: S.recon };
    } else {
      await new Promise((r) => setTimeout(r, 650));
      const pv = previewSheet();
      const wa = S.inbox.filter((i) => ['pendiente_aprobacion', 'requiere_info'].includes(i.status)).length;
      summary = { sheets: pv.rows.length, stats: pv.stats, wa, recon: runRecon() };
    }
    S.lastSync = new Date().toISOString(); save(); render();
    const t = summary.recon.totals;
    modal({ title: 'Información actualizada y conciliada', body: `
      <div class="kpis">
        <div class="kpi"><span class="k">Filas de Drive por revisar</span><span class="v">${num(summary.sheets)}</span>${summary.stats ? `<span class="s">${summary.stats.nuevas} nuevas · ${summary.stats.modificadas} modificadas · ${summary.stats.coincidenWhatsApp} coinciden con WhatsApp</span>` : ''}</div>
        <div class="kpi"><span class="k">WhatsApp por aprobar</span><span class="v">${num(summary.wa)}</span></div>
        <div class="kpi ${t.importante ? 'alert' : ''}"><span class="k">Diferencias importantes</span><span class="v">${num(t.importante || 0)}</span></div>
        <div class="kpi ${t.perdida ? 'alert' : ''}"><span class="k">Pérdida estimada</span><span class="v">${moneyK(-t.perdida)}</span><span class="s">sobrante ${money(t.sobrante)}</span></div>
      </div>
      <div class="row">${Object.entries(RECON_STATUS).map(([k, v]) => (t[k] ? pill(`${v}: ${t[k]}`, RECON_PILL[k]) : '')).join(' ')}</div>
      <p class="muted small" style="margin:0">Nada se descontó del inventario sin aprobación. Revisa las filas de Drive y la bandeja de WhatsApp antes de cerrar el día.</p>`,
      foot: `<a class="btn" href="#drive" data-close>Revisar Drive</a><a class="btn" href="#whatsapp" data-close>Revisar WhatsApp</a><a class="btn pri" href="#conciliacion" data-close>Ver conciliación</a>` });
  } catch (e) { toast('No se pudo actualizar: ' + e.message); }
  finally { b.classList.remove('spin'); b.disabled = false; }
}

BIND.inventario = (el) => {

function readFile(input) { return new Promise((res) => { const f = input.files?.[0]; if (!f) return res(null); const r = new FileReader(); r.onload = () => res({ name: f.name, data: r.result, type: f.type }); r.readAsDataURL(f); }); }

function kardex(pid) {
  const p = prodById(pid);
  const ms = S.movements.filter((m) => m.productId === pid).sort((a, b) => new Date(a.ts) - new Date(b.ts));
  let bal = p.stockInit;
  const rows = ms.map((m) => { const s = MOVEMENT_TYPES[m.type].sign; if (m.status === 'aprobado') bal += s * m.qty; return { m, bal: m.status === 'aprobado' ? bal : null }; }).reverse();
  const cnt = S.counts.filter((c) => c.productId === pid).sort((a, b) => new Date(b.ts) - new Date(a.ts))[0];
  const md = modal({ title: `Historial · ${esc(p.name)}`, wide: true, body: `
    <div class="kpis"><div class="kpi"><span class="k">Stock inicial</span><span class="v">${num(p.stockInit)}</span></div><div class="kpi"><span class="k">Stock teórico</span><span class="v">${num(stockOf(p))}</span><span class="s">${esc(p.unit)}</span></div><div class="kpi"><span class="k">Último conteo</span><span class="v">${cnt ? num(cnt.qty) : '—'}</span><span class="s">${cnt ? fdt(cnt.ts) + ' · ' + esc(cnt.countedBy) : 'sin conteo'}</span></div><div class="kpi money"><span class="k">Costo promedio</span><span class="v">${money(p.avgCost)}</span></div></div>
    <div class="tbl-wrap" style="max-height:52vh;overflow:auto"><table><thead><tr><th>Fecha</th><th>Tipo</th><th class="n">Cantidad</th><th class="n">Saldo</th><th>Fuente</th><th>Responsable · área</th><th>Estado</th><th></th></tr></thead><tbody>
    ${rows.map(({ m, bal }) => `<tr><td class="small">${fdt(m.ts)}</td><td>${MOVEMENT_TYPES[m.type].label}${m.reason ? `<span class="sub">${esc(m.reason)}</span>` : ''}</td><td class="n num ${MOVEMENT_TYPES[m.type].sign < 0 ? 'neg' : 'pos'}">${MOVEMENT_TYPES[m.type].sign < 0 ? '−' : '+'}${num(m.qty)}</td><td class="n num">${bal === null ? '—' : num(bal)}</td><td>${esc(SOURCES[m.source] || m.source)}${m.evidence ? ' <span class="tag">evidencia</span>' : ''}</td><td class="small">${esc(m.user || '')}${m.area ? ' · ' + esc(m.area) : ''}</td><td>${mvPill(m.status)}</td><td>${m.status === 'aprobado' && !m.reversesId && can('movimientos.aprobar') ? `<button class="btn sm bad" data-void="${m.id}">Anular</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="8"><div class="empty">Sin movimientos</div></td></tr>'}
    </tbody></table></div><p class="muted small" style="margin:0">Los movimientos no se eliminan. Anular crea un contramovimiento que conserva la trazabilidad.</p>`,
    foot: `${can('movimientos.crear') ? `<button class="btn" id="kx-mv">${ic('sync')} Registrar movimiento</button>` : ''}<button class="btn pri" data-close>Cerrar</button>` });
  md.querySelector('#kx-mv')?.addEventListener('click', () => movementForm({ productId: pid }));
  $$('[data-void]', md).forEach((b) => (b.onclick = async () => { const reason = await ask({ title: 'Anular movimiento', text: 'Se creará un ajuste que revierte este movimiento. El original queda visible como anulado.', input: 'Motivo de la anulación', label: 'Anular', danger: true }); if (reason) { await run('voidMv', b.dataset.void, reason); kardex(pid); toast('Movimiento anulado'); } }));
}

function loadInvoiceFromInbox(id) {

function supplierForm(s = null, cb) {
  s = s || { name: '', taxId: '', phone: '', email: '', contact: '', notes: '' };
  const m = modal({ title: s.id ? 'Editar proveedor' : 'Nuevo proveedor', body: `<div class="grid g2">${[['name', 'Razón social'], ['taxId', 'NIT'], ['contact', 'Contacto'], ['phone', 'Teléfono / WhatsApp'], ['email', 'Correo']].map(([k, l]) => `<div class="field"><label for="sf-${k}">${l}</label><input class="in" id="sf-${k}" value="${esc(s[k] || '')}"></div>`).join('')}<div class="field"><label for="sf-notes">Observaciones</label><input class="in" id="sf-notes" value="${esc(s.notes || '')}"></div></div>`,
    foot: `<button class="btn" data-close>Cancelar</button><button class="btn pri" id="sf-ok">${ic('check')} Guardar</button>` });
  m.querySelector('#sf-ok').onclick = async () => { const o = { ...s }; ['name', 'taxId', 'contact', 'phone', 'email', 'notes'].forEach((k) => (o[k] = m.querySelector('#sf-' + k).value.trim())); if (!o.name) { toast('Escribe el nombre del proveedor.'); return; } closeModal(); if (S.settings.mode === 'demo') { const r = act.saveSupplier(o); save(); cb ? cb(r) : render(); } else { await run('saveSupplier', o); cb?.(S.suppliers.find((x) => x.name === o.name)); } toast('Proveedor guardado'); };
}
RENDER.proveedores = () => {
  const month = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  const rows = S.suppliers.map((s) => { const ps = S.purchases.filter((p) => p.supplierId === s.id && p.status === 'aprobada'); return { s, n: ps.length, total: ps.reduce((a, p) => a + p.total, 0), mes: ps.filter((p) => new Date(p.purchasedAt + 'T12:00') >= month).reduce((a, p) => a + p.total, 0), last: ps.map((p) => p.purchasedAt).sort().pop(), prods: S.products.filter((p) => p.supplierId === s.id).length }; }).sort((a, b) => b.total - a.total);
  return `<div class="row"><span class="muted small">${S.suppliers.length} proveedores</span><span class="spacer"></span><button class="btn pri" id="sp-new">${ic('plus')} Nuevo proveedor</button></div>
  <div class="tbl-wrap"><table><thead><tr><th>Proveedor</th><th>NIT</th><th>Contacto</th><th class="n">Productos</th><th class="n">Compras</th><th class="n">Este mes</th><th class="n">Histórico</th><th>Última compra</th><th></th></tr></thead><tbody>
  ${rows.map(({ s, n, total, mes, last, prods }) => `<tr><td><b>${esc(s.name)}</b></td><td class="mono small">${esc(s.taxId || '—')}</td><td class="small">${esc(s.contact || '')}<span class="sub">${esc(s.phone || '')}</span></td><td class="n num">${prods}</td><td class="n num">${n}</td><td class="n num">${money(mes)}</td><td class="n num">${money(total)}</td><td class="small">${last ? fdate(last + 'T12:00') : '—'}</td><td><button class="btn sm" data-se="${s.id}">${ic('edit')}</button></td></tr>`).join('')}
  </tbody></table></div>`;
};

  return `<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);align-items:start" id="gx-grid">
  <div class="card"><div class="card-h"><h2>Registrar gasto</h2></div>
    <div class="grid g2"><div class="field"><label for="gx-d">Fecha</label><input type="date" class="in" id="gx-d" value="${iso(Date.now())}"></div><div class="field"><label for="gx-c">Categoría</label><select class="in" id="gx-c">${EXP_CATS.map((c) => opt(c, c)).join('')}</select></div></div>

    <div class="grid g2" style="margin-top:8px"><div class="field"><label for="gx-s">Proveedor</label><select class="in" id="gx-s">${opt('', '—')}${S.suppliers.map((s) => opt(s.id, s.name)).join('')}</select></div><div class="field"><label for="gx-f">Comprobante</label><input type="file" class="in" id="gx-f" accept="image/*,application/pdf"></div></div>
    <button class="btn pri" id="gx-ok" style="margin-top:12px;width:100%">${ic('check')} Registrar gasto</button></div>
  <div class="card"><div class="card-h"><h2>Gastos</h2><span class="spacer"></span><span class="muted small">Este mes: <b class="num">${money(tm)}</b></span></div>

BIND.integraciones = (el) => {

    const url = $('#sb-url', el).value.trim().replace(/\/$/, ''), key = $('#sb-key', el).value.trim();

    if (!key) { toast('Pega la clave anon del proyecto (Settings › API).'); return; }
    cloud.lastEmail = $('#sb-email', el).value.trim();
    if (!cloud.lastEmail || !$('#sb-pw', el).value) { toast('Escribe el correo y la contraseña de tu usuario de Supabase.'); return; }
    e.target.disabled = true;
    try {
      s.cloud = { on: false, url, key }; s.mode = 'demo';
      await cloud.login(cloud.lastEmail, $('#sb-pw', el).value);
      s.cloud.on = true;
      await cloud.connect();
      save(); render(); toast('Conectado con Supabase');
    } catch (err) {
      s.cloud.on = false; cloud.ready = false; cloud.setStatus('off');
      try { await cloud.sb?.auth.signOut(); } catch { /* sin red */ }
      save(); render(); toast('No se pudo conectar: ' + err.message);
    }
  });
  $('#cl-backup', el)?.addEventListener('click', async (e) => { e.target.disabled = true; try { await cl.backupToSupabase(); } finally { e.target.disabled = false; } });
  $('#sb-reload', el)?.addEventListener('click', async () => { try { await cloud.load(); render(); toast('Datos recargados'); } catch (err) { toast('No se pudo recargar: ' + err.message); } });
  $('#sb-out', el)?.addEventListener('click', async () => { if (await ask({ title: 'Desconectar Supabase', text: 'La página vuelve a los datos de ejemplo de este navegador. Los datos en Supabase no se borran.', label: 'Desconectar' })) { await cloud.disconnect(); toast('Desconectado'); } });

  $('#ig-th', el).onchange = (e) => { s.threshold = Math.max(0.85, Math.min(1, +e.target.value || 0.85)); save(); render(); };
  $('#ig-win', el).onchange = (e) => { s.windowH = +e.target.value || 12; save(); };

/* ---------------- arranque ---------------- */
function boot() {
  const saved = store.get(LS_KEY, null);
  const settings = store.get(LS_KEY + '-settings', null);
  S = saved && saved.products?.length ? saved : seedState();
  if (settings) S.settings = { ...S.settings, ...settings };
  upgradeState();
  if (S.settings.mode === 'api') remote.load().then(render).catch(() => { S.settings.mode = 'demo'; toast('No se pudo conectar con la API; se muestran datos de ejemplo.'); render(); });
  if (window.claude?.use) cl.boot(); else cloud.boot();
  applyTheme();
  $('#theme-btn').onclick = cycleTheme;
  $('#sync-btn').onclick = syncAndReconcile;
  $('#menu-btn').onclick = () => $('.app').classList.toggle('nav-open');
  $('.app').addEventListener('click', (e) => { if (e.target === $('.app') && $('.app').classList.contains('nav-open')) $('.app').classList.remove('nav-open'); });
  render();
  save();
}

  async boot() {

      cloud.loading = false; cloud.ready = false; cloud.setStatus('error', e.message);
      toast('No se pudo cargar desde Supabase: ' + e.message);
      render();
    }
  },
};


/* ---------------- Datos en Claude (página publicada en claude.ai) ----------------
   Dentro de claude.ai la página no puede llamar a servidores externos, así que guarda en la base
   de datos del propio artefacto (capacidad `db`) y reconoce a cada persona con la capacidad `user`.
   Modelo:
     ccs/<clave>             estado general (configuración, conciliación, facturación sin líneas…)
     ccl_<lista>/b<NN>       registros de cada lista repartidos en "cubetas" { items: { id: json } }
     cca_s/<clave>           estado de administración (permisos por rol)   · solo Editores escriben
     cca_users/b<NN>         usuarios de Control de acceso                   · solo Editores escriben
     ccj/<id de la persona>  solicitud de ingreso de cada persona (la escribe ella misma)
   Las reglas de acceso van en el manifiesto de la publicación (ver supabase/../README). */
const CL_ADMIN = new Set(['users', 'rolePerms', 'permsV', 'usersV']);
const CL_NESTED = { billing: ['lines'] };
const CL_BUCKETS = { movements: 32, 'billing.lines': 32, counts: 16, audit: 8, inbox: 8, purchases: 8, expenses: 8, requests: 4 };
const clHash = (s, n) => { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return (h >>> 0) % n; };
const clErr = (e) => (e && e.code === 'quota_exceeded' ? 'la base de datos de Claude está llena' : e && e.code === 'invalid_argument' ? 'no tienes permiso para guardar este cambio' : (e && (e.message || e.code)) || 'error desconocido');
const cl = {
  active: false, db: null, user: null, myId: null, meInfo: null, owner: false, admin: false, write: true,
  ready: false, loading: false, snap: new Map(), seq: new Map(), known: new Set(), shape: { lists: {} },
  timer: null, busy: false, again: false, unsubs: [], renderT: null, status: 'off', lastSaved: null, joined: false,
  on: () => cl.active && cl.ready,
  /* ---- listas y su ubicación ---- */
  listKeys(state) {
    const out = [];
    for (const [k, v] of Object.entries(state)) if (k !== 'settings' && isRecordList(v)) out.push(k);
    for (const [k, subs] of Object.entries(CL_NESTED)) for (const sub of subs) if (state[k] && isRecordList(state[k][sub])) out.push(k + '.' + sub);
    return out;
  },
  getList: (k, st = S) => (k.includes('.') ? st[k.split('.')[0]]?.[k.split('.')[1]] : st[k]),
  setList(k, arr, st = S) { if (k.includes('.')) { const [a, b] = k.split('.'); (st[a] ||= {})[b] = arr; } else st[k] = arr; },
  coll: (k) => (CL_ADMIN.has(k) ? 'cca_' : 'ccl_') + k,
  buckets(k, n) { return (cl.shape.lists[k] ||= { b: CL_BUCKETS[k] || Math.max(1, Math.min(64, 2 ** Math.ceil(Math.log2(n / 200 + 1)))) }).b; },
  docPath: (k, id) => cl.coll(k) + '/b' + String(clHash(id, cl.buckets(k, 0))).padStart(2, '0'),
  stateDoc: (k) => (CL_ADMIN.has(k) ? 'cca_s/' : 'ccs/') + k,
  stateVal(k, v) { if (!CL_NESTED[k] || !v || typeof v !== 'object') return v; const o = { ...v }; for (const sub of CL_NESTED[k]) if (isRecordList(o[sub])) delete o[sub]; return o; },
  /** Estado → unidades guardables. Clave "L|lista|id" o "S|clave". */
  units(state) {
    const out = new Map();
    const lists = cl.listKeys(state);
    for (const k of lists) {
      const arr = cl.getList(k, state);
      cl.buckets(k, arr.length);
      let min = Infinity, max = -Infinity;
      for (const it of arr) { const s = cl.seq.get(k + '|' + it.id); if (s != null) { if (s < min) min = s; if (s > max) max = s; } }
      if (min === Infinity) { min = 0; max = -1; }
      arr.forEach((it, i) => {
        const sk = k + '|' + it.id;
        if (!cl.seq.has(sk)) { const s = i === 0 && arr.length > 1 && max >= min ? --min : ++max; cl.seq.set(sk, s); }
        out.set('L|' + sk, { list: k, id: it.id, path: cl.docPath(k, it.id), json: canon([cl.seq.get(sk), it]) });
      });
    }
    for (const [k, v] of Object.entries(state)) {
      if (k === 'settings' || lists.includes(k) || v === undefined || typeof v === 'function') continue;
      out.set('S|' + k, { key: k, path: cl.stateDoc(k), json: canon(cl.stateVal(k, v)) });
    }
    return out;
  },
  canWriteUnit: (u) => cl.write && (cl.admin || !(CL_ADMIN.has(u.list || u.key))),
  /* ---- estado de guardado ---- */
  setStatus(st) {
    cl.status = st; if (st === 'ok') cl.lastSaved = new Date();
    const el = $('#cloud-st'); if (el) el.innerHTML = cl.statusHtml();
    const ov = $('#cloud-ov'); if (ov) ov.hidden = !cl.loading;
  },
  statusHtml() {
    const t = cl.lastSaved ? cl.lastSaved.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }) : '';
    return ({ off: pill('Sin datos', 'p-mut'), loading: pill('Cargando…', 'p-info'), saving: pill('Guardando…', 'p-info'), ok: pill(t ? 'Guardado ' + t : 'Al día', 'p-ok'), error: pill('Sin guardar', 'p-bad'), readonly: pill('Solo lectura', 'p-warn') })[cl.status] || '';
  },
  queue(delay = 700) { if (!cl.on()) return; clearTimeout(cl.timer); cl.timer = setTimeout(cl.flush, delay); },
  async flush() {
    if (!cl.on() || !cl.write) return;
    if (cl.busy) { cl.again = true; return; }
    cl.busy = true;
    try {
      const cur = cl.units(S);
      const docs = new Map(); // path → { items } | { state }
      for (const [key, u] of cur) {
        if (cl.snap.get(key) === u.json || !cl.canWriteUnit(u)) continue;
        if (u.list) ((docs.get(u.path) || docs.set(u.path, { items: {}, keys: [] }).get(u.path)).items[u.id] = u.json, docs.get(u.path).keys.push([key, u.json]));
        else docs.set(u.path, { state: u.json, keys: [[key, u.json]] });
      }
      for (const key of cl.snap.keys()) {
        if (cur.has(key) || !key.startsWith('L|')) continue;
        const [, list, ...rest] = key.split('|'); const id = rest.join('|');
        if (!cl.canWriteUnit({ list })) continue;
        const path = cl.docPath(list, id);
        (docs.get(path) || docs.set(path, { items: {}, keys: [] }).get(path)).items[id] = null;
        docs.get(path).keys.push([key, null]);
      }
      const shapeJson = canon(cl.shape);
      if (cl.snap.get('shape') !== shapeJson) docs.set('ccs/_shape', { raw: { shape: shapeJson }, keys: [['shape', shapeJson]] });
      if (!docs.size) { if (cl.status !== 'ok') cl.setStatus('ok'); return; }
      cl.setStatus('saving');
      for (const [path, d] of docs) {
        const ref = cl.db.doc(path);
        if (d.items) {
          if (cl.known.has(path)) await ref.update({ items: d.items });
          else { try { await ref.update({ items: d.items }); } catch (e) { if (e?.code !== 'invalid_argument') throw e; await ref.set({ items: d.items }); } cl.known.add(path); }
        } else if (d.raw) await ref.set(d.raw);
        else await ref.set({ v: d.state });
        for (const [key, json] of d.keys) { if (json === null) { cl.snap.delete(key); } else cl.snap.set(key, json); }
      }
      cl.setStatus('ok');
    } catch (e) {
      cl.setStatus('error');
      toast('No se guardó en Claude: ' + clErr(e) + (e?.code === 'unavailable' || e?.code === 'resource_exhausted' ? '. Se reintentará en 15 s.' : '.'));
      if (e?.code === 'unavailable' || e?.code === 'resource_exhausted') setTimeout(cl.flush, 15000);
    } finally {
      cl.busy = false;
      if (cl.again) { cl.again = false; cl.queue(100); }
    }
  },
  /* ---- lectura ---- */
  async readColl(path) { const q = await cl.db.collection(path).get(); return q.docs.filter((d) => d.exists).map((d) => ({ id: d.id, data: d.data() })); },
  /** Lee todo. Devuelve false si la base está vacía. */
  async load() {
    const [ccs, ccas] = await Promise.all([cl.readColl('ccs'), cl.readColl('cca_s')]);
    const shapeDoc = ccs.find((d) => d.id === '_shape');
    if (!shapeDoc) return false;
    cl.shape = JSON.parse(shapeDoc.data.shape || '{"lists":{}}'); cl.shape.lists ||= {};
    const st = {}; cl.snap = new Map(); cl.seq = new Map(); cl.known = new Set();
    cl.snap.set('shape', canon(cl.shape));
    for (const d of [...ccs, ...ccas]) if (d.id !== '_shape' && typeof d.data.v === 'string') st[d.id] = JSON.parse(d.data.v);
    const lists = Object.keys(cl.shape.lists);
    const got = await Promise.all(lists.map((k) => cl.readColl(cl.coll(k))));
    lists.forEach((k, i) => {
      const rows = [];
      for (const d of got[i]) {
        cl.known.add(cl.coll(k) + '/' + d.id);
        for (const [id, json] of Object.entries(d.data.items || {})) if (typeof json === 'string') { const [s, rec] = JSON.parse(json); rows.push([s, rec]); cl.seq.set(k + '|' + id, s); }
      }
      rows.sort((a, b) => a[0] - b[0]);
      cl.setList(k, rows.map((r) => r[1]), st);
    });
    const settings = S.settings;
    S = st; S.settings = settings;
    for (const [key, u] of cl.units(S)) cl.snap.set(key, u.json);
    upgradeState();
    return true;
  },
  /* ---- cambios de otras personas ---- */
  subscribe() {
    cl.unsubs.forEach((u) => u()); cl.unsubs = [];
    const onErr = (e) => { if (e?.code === 'revoked') { cl.write = false; cl.setStatus('readonly'); } };
    const watchState = (coll) => cl.unsubs.push(cl.db.collection(coll).onSnapshot((q) => {
      let changed = false;
      for (const ch of q.docChanges()) {
        const d = ch.doc, k = d.id;
        if (k === '_shape') { if (ch.type !== 'removed') { const sh = JSON.parse(d.data().shape || '{}'); for (const [lk, lv] of Object.entries(sh.lists || {})) if (!cl.shape.lists[lk]) { cl.shape.lists[lk] = lv; watchList(lk); } cl.snap.set('shape', canon(cl.shape)); } continue; }
        if (ch.type === 'removed' || typeof d.data().v !== 'string') continue;
        const json = canon(JSON.parse(d.data().v));
        if (cl.snap.get('S|' + k) === json) continue;
        const v = JSON.parse(d.data().v);
        if (CL_NESTED[k] && S[k]) for (const sub of CL_NESTED[k]) if (isRecordList(S[k][sub])) v[sub] = S[k][sub];
        S[k] = v; cl.snap.set('S|' + k, json); changed = true;
      }
      if (changed) cl.renderSoon();
    }, onErr));
    const watched = new Set();
    const watchList = (k) => {
      if (watched.has(k)) return; watched.add(k);
      cl.unsubs.push(cl.db.collection(cl.coll(k)).onSnapshot((q) => {
        let changed = false;
        for (const ch of q.docChanges()) {
          if (ch.type === 'removed') continue;
          cl.known.add(cl.coll(k) + '/' + ch.doc.id);
          for (const [id, json] of Object.entries(ch.doc.data().items || {})) {
            const key = 'L|' + k + '|' + id;
            const arr = cl.getList(k) || (cl.setList(k, []), cl.getList(k));
            if (json === null) {
              if (!cl.snap.has(key)) continue;
              cl.snap.delete(key); cl.seq.delete(k + '|' + id);
              const i = arr.findIndex((x) => x.id === id); if (i >= 0) arr.splice(i, 1);
              changed = true; continue;
            }
            if (cl.snap.get(key) === json) continue;
            const [s, rec] = JSON.parse(json);
            const i = arr.findIndex((x) => x.id === id);
            if (i >= 0) arr[i] = rec;
            else { let at = arr.length; for (let j = 0; j < arr.length; j++) if ((cl.seq.get(k + '|' + arr[j].id) ?? Infinity) > s) { at = j; break; } arr.splice(at, 0, rec); }
            cl.seq.set(k + '|' + id, s); cl.snap.set(key, json); changed = true;
          }
        }
        if (changed) cl.renderSoon();
      }, onErr));
    };
    watchState('ccs'); watchState('cca_s');
    Object.keys(cl.shape.lists).forEach(watchList);
    if (cl.admin) cl.unsubs.push(cl.db.collection('ccj').onSnapshot((q) => { for (const d of q.docs) if (d.exists) cl.admit(d.id, d.data()); }, onErr));
  },
  renderSoon() {
    clearTimeout(cl.renderT);
    cl.renderT = setTimeout(() => { if ($('#modal') || document.activeElement?.matches?.('input,textarea,select')) { cl.renderSoon(); return; } render(); }, 800);
  },
  /* ---- personas y perfiles ---- */
  myUser: () => S.users?.find((u) => u.claudeId && u.claudeId === cl.myId) || cl.byEmail(cl.meInfo?.email),
  /** Usuario creado a mano en Control de acceso (sin cuenta vinculada) con este correo. */
  byEmail: (email) => { const e = String(email || '').trim().toLowerCase(); return e ? S.users?.find((u) => !u.claudeId && (u.email || '').trim().toLowerCase() === e) : undefined; },
  /** Para `me()`: quien no es administrador siempre se ve a sí mismo; quien aún no tiene perfil entra como empleado. */
  meOverride() {
    if (!cl.on() || !cl.myId) return null;
    const u = cl.myUser();
    if (u && u.active !== false && u.role === 'ADMIN') return null;
    if (cl.owner) return u ? { ...u, role: 'ADMIN' } : { id: 'owner', name: cl.meInfo?.name || 'Administrador', role: 'ADMIN', area: '', areas: [] };
    if (u && u.active !== false) return u;
    return { id: 'pendiente', name: cl.meInfo?.name || 'Invitado', role: 'EMPLEADO', area: '', areas: [], pending: true };
  },
  /** Agrega a Control de acceso a quien pidió entrar (solo lo hace la vista de un administrador). */
  admit(claudeId, req) {
    if (!cl.admin || S.users?.some((u) => u.claudeId === claudeId)) return;
    const pre = cl.byEmail(req?.email);
    if (pre) {
      pre.claudeId = claudeId;
      log('usuario.vinculo', `${pre.name} entró con su cuenta de Claude (${ROLES[pre.role]})`, 'Sistema');
      toast(`${pre.name} entró a Capybara Control como ${ROLES[pre.role]}.`);
      save(); cl.renderSoon(); return;
    }
    const base = String(req?.name || '').trim().slice(0, 60) || 'Persona nueva';
    const name = S.users.some((u) => u.name === base) ? `${base} (${S.users.length + 1})` : base;
    S.users.push({ id: uid('u'), claudeId, name, email: String(req?.email || '').slice(0, 120), role: 'EMPLEADO', area: '', areas: [], phone: '', active: true });
    log('usuario.alta', `${name} entró por primera vez (Empleado)`, 'Sistema');
    toast(`${name} entró a Capybara Control como empleado. Asígnale su perfil en Control de acceso.`);
    save(); cl.renderSoon();
  },
  async identify(first = false) {
    const u = cl.myUser();
    if (cl.owner) {
      if (!u) {
        const name = cl.meInfo?.name || 'Administrador';
        S.users.push({ id: uid('u'), claudeId: cl.myId, name: S.users.some((x) => x.name === name) ? name + ' (dueño)' : name, email: cl.meInfo?.email || '', role: 'ADMIN', area: 'Administración', areas: [], phone: '', active: true });
      } else if (u.role !== 'ADMIN') u.role = 'ADMIN';
      S.settings.user = cl.myUser().name;
      return;
    }
    if (u && u.claudeId) { if (u.role === 'ADMIN') S.settings.user ||= u.name; return; }
    if (!cl.joined && cl.write) {
      cl.joined = true;
      try { await cl.db.doc('ccj/' + cl.myId).set({ name: cl.meInfo?.name || '', email: cl.meInfo?.email || '', at: new Date().toISOString() }); } catch { /* sin permiso de escritura */ }
    }
    if (u) return; // creado antes por correo: ya tiene perfil; el administrador vincula la cuenta al abrir
    if (first !== 'silent') toast('Entraste como empleado. El administrador puede asignarte tu perfil en Control de acceso.');
  },
  /** Deja el catálogo y vacía lo transaccional y de ejemplo (igual que en Supabase). */
  cleanStart() { cloud.cleanStart(); S.users = []; },
  /** Copia todo el estado a Supabase (tabla cc_records) con el conector de Supabase del administrador. */
  async backupToSupabase() {
    const mcp = await window.claude.use('mcp').catch(() => null);
    if (!mcp) { toast('Para guardar la copia, conecta el conector de Supabase en claude.ai (Configuración › Conectores).'); return false; }
    const project = (CLOUD_DEFAULT.url.match(/^https:\/\/([a-z0-9]+)\./) || [])[1];
    const rows = [...cloud.rows(S).values()];
    const all = rows.map((r) => JSON.stringify(r.data)).join('');
    let tag = 'cc'; while (all.includes('$' + tag + '$')) tag += 'x';
    const q = (s) => '$' + tag + '$' + s + '$' + tag + '$';
    const sql = (o) => mcp.callTool('Supabase', 'execute_sql', { project_id: project, query: o }, { cache: false });
    try {
      cl.setStatus('saving');
      let batch = [];
      for (let i = 0; i <= rows.length; i++) {
        const r = rows[i];
        if (r) batch.push(`(${q(r.collection)}, ${q(r.id)}, ${r.pos | 0}, ${q(JSON.stringify(r.data))}::jsonb)`);
        if (batch.length && (!r || batch.join(',').length > 90000)) {
          await sql(`insert into public.cc_records (collection, id, pos, data) values ${batch.join(',\n')} on conflict (collection, id) do update set pos = excluded.pos, data = excluded.data;`);
          batch = [];
        }
      }
      const byCol = {};
      for (const r of rows) (byCol[r.collection] ||= []).push(r.id);
      const cols = Object.keys(byCol);
      await sql(`delete from public.cc_records where collection <> all (array[${cols.map(q).join(',')}]::text[]);\n` + cols.map((c) => `delete from public.cc_records where collection = ${q(c)} and id <> all (array[${byCol[c].map(q).join(',')}]::text[]);`).join('\n'));
      cl.setStatus('ok');
      log('supabase.copia', `${rows.length} registros copiados a Supabase`);
      save();
      toast(`Copia guardada en Supabase: ${rows.length} registros.`);
      return true;
    } catch (e) {
      cl.setStatus('ok');
      const m = { consent_required: 'permite el conector de Supabase para esta página', approval_required: 'aprueba la operación cuando Claude lo pida', server_not_connected: 'conecta el conector de Supabase en claude.ai', not_in_manifest: 'esta versión de la página no tiene permiso para usar Supabase' }[e?.code];
      toast('No se guardó la copia en Supabase: ' + (m || e?.message || e?.code || 'error desconocido') + '.');
      return false;
    }
  },
  async boot() {
    if (!window.claude?.use) return;
    let db = null, user = null;
    try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch { /* sin capacidades */ }
    if (!db || !user) return;
    cl.db = db; cl.user = user; cl.active = true; cl.loading = true; cl.setStatus('loading');
    try {
      const [me, canEdit, canWrite] = await Promise.all([user.me(), user.canEdit(), user.can('data.write')]);
      cl.meInfo = me; cl.myId = me.id; cl.owner = !!me.isOwner; cl.admin = cl.owner || !!canEdit; cl.write = canWrite !== false;
      S.settings.cloud = { ...(S.settings.cloud || {}), on: false };
      let had = await cl.load();
      if (!had) {
        if (!cl.admin) { cl.loading = false; cl.active = false; cl.setStatus('off'); toast('El administrador todavía no ha iniciado los datos de Capybara Control. Se muestran datos de ejemplo.'); render(); return; }
        cl.loading = false; cl.setStatus('off');
        const how = await cloud.choose({
          title: 'Iniciar Capybara Control',
          text: `Los datos se guardarán en Claude y los verá todo el equipo con quien compartas esta página. <b>Catálogo del hostel</b>: ${S.products.length} productos y ${S.suppliers.length} proveedores del inventario transcrito, sin movimientos, compras, facturas, gastos ni histórico de ventas. <b>Datos de ejemplo</b>: todo lo que ves ahora, útil solo para probar.`,
          options: [{ label: 'Empezar con el catálogo del hostel', value: 'clean', pri: true }, { label: 'Usar datos de ejemplo', value: 'demo' }],
        });
        if (!how) { cl.active = false; toast('No se iniciaron los datos. Recarga la página cuando quieras empezar.'); render(); return; }
        cl.loading = true; cl.setStatus('saving');
        if (how === 'clean') cl.cleanStart();
        cl.snap = new Map(); cl.seq = new Map(); cl.known = new Set(); cl.shape = { lists: {} };
        cl.ready = true;
        await cl.identify(true);
        await cl.flush();
        if (cl.status !== 'ok') throw new Error('no se pudieron guardar los datos iniciales');
      } else {
        cl.ready = true;
        await cl.identify('silent');
        if (!cl.write) cl.setStatus('readonly'); else { cl.setStatus('ok'); cl.queue(); }
      }
      cl.subscribe();
    } catch (e) {
      cl.ready = false; cl.active = false; cl.setStatus('error');
      toast('No se pudieron cargar los datos de Claude: ' + clErr(e));
    } finally { cl.loading = false; cl.setStatus(cl.status); render(); }
  },
};

        { k: 'sub', h: 'Subtotal', w: 108, t: 'calc', f: (l) => lineCalc(l).sub, fx: (r) => `=F${r}*G${r}` }, { k: 'tax', h: 'Impuesto $', w: 98, t: 'calc', f: (l) => lineCalc(l).tax, fx: (r) => `=I${r}*H${r}` },

        { k: 'st', h: 'Estado', w: 128, t: 'calc', f: (l) => ({ borrador: 'Borrador', emitida: S.billing.status[l.inv]?.alegra ? 'En Alegra' : 'Emitida', anulada: 'Anulada' }[invStatus(l.inv)]) },
      ],

    const rows = [...S.billing.draftPurchases, ...fromPurch].filter((l) => !SH.q || normalize(`${l.inv} ${supById(l.supplierId)?.name || ''} ${prodById(l.productId)?.name || ''}`).includes(normalize(SH.q)));

        { k: 'qty', h: 'Cant.', w: 64, t: 'num' }, { k: 'unit', h: 'Unidad', w: 80, t: 'calc', f: (l) => prodById(l.productId)?.unit || '' }, { k: 'price', h: 'Costo unit.', w: 108, t: 'money' }, { k: 'taxPct', h: 'IVA', w: 90, t: 'tax' },
        { k: 'sub', h: 'Subtotal', w: 108, t: 'calc', f: (l) => lineCalc(l).sub, fx: (r) => `=E${r}*G${r}` }, { k: 'tax', h: 'IVA $', w: 92, t: 'calc', f: (l) => lineCalc(l).tax, fx: (r) => `=I${r}*H${r}` }, { k: 'total', h: 'Total', w: 112, t: 'calc', f: (l) => lineCalc(l).total, fx: (r) => `=I${r}+J${r}` },
        { k: 'pay', h: 'Pago', w: 120, t: 'select', o: PAY }, { k: 'st', h: 'Estado', w: 110, t: 'calc', f: (l) => l._st || 'Nueva' },

    try { const r = await remote.req('/api/v1/products/import', { method: 'POST', body: { rows: IM.rows.map((r) => Object.fromEntries(Object.entries(r).map(([k, v]) => [k, v instanceof Date ? iso(v) : v]))), mapping: IM.mapping, options: IM.opt, apply: items.map((x) => x.row) } }); await remote.load(); IM.done = { ...r.summary, file: IM.file.name, sheet: IM.sheet, stockMode: IM.opt.stockMode }; render(); toast('Importación aplicada'); }

    if (x.action === 'nuevo') {

/** Histórico de ventas de EJEMPLO (agregado por día) para que el módulo de socios tenga tendencia. */
function seedSalesHistory() {
  const R = rng(91126);
  const now = new Date(), h = [];
  const frac = Math.min(1, Math.max(0.05, (now.getHours() + now.getMinutes() / 60) / 24));
  for (let d = 120; d >= 0; d--) {
    const day = new Date(+d0(now) - d * DAY), dow = day.getDay(), date = iso(day);
    const season = 1 + (120 - d) / 120 * 0.18; // temporada alta hacia diciembre
    const occ = Math.min(0.98, ([5, 6].includes(dow) ? 0.78 : dow === 0 ? 0.66 : 0.56) * season * (0.88 + R() * 0.24));
    const k = d === 0 ? frac : 1;
    const dorm = Math.round(S.partners.dormBeds * occ * k), priv = Math.round(S.partners.privRooms * Math.min(1, occ * 1.08) * k);
    const nights = dorm + priv;
    const hosp = dorm * 55000 + priv * 165000;
    const bar = Math.round(nights * (8000 + R() * 9000) * ([5, 6].includes(dow) ? 1.45 : 1) / 100) * 100;
    const rest = Math.round(nights * (5500 + R() * 4500) / 100) * 100;
    const otros = Math.round(R() * 70000 * k / 100) * 100;
    const ing = { Hospedaje: hosp, Bar: bar, Restaurante: rest, Otros: otros };
    const sub = hosp + bar + rest + otros;
    const imp = Math.round(hosp * 0.19 * 0.45 + (bar + rest) * 0.08 + otros * 0.19);
    const total = sub + imp;
    const pagos = { Tarjeta: Math.round(total * 0.44), Transferencia: Math.round(total * 0.2), Efectivo: Math.round(total * 0.21) }; pagos.Nequi = total - pagos.Tarjeta - pagos.Transferencia - pagos.Efectivo;
    const gastos = {};
    // costos fijos de ejemplo (no existen en los gastos registrados de la demo, así que no se duplican)
    { const dm = day.getDate(), last = new Date(day.getFullYear(), day.getMonth() + 1, 0).getDate(); if (dm === 1) gastos.Arriendo = 8500000; if (dm === 15 || dm === last) gastos['Nómina'] = 9200000; if (dm === 10) gastos['Seguridad social y parafiscales'] = 4300000; gastos['Comisiones OTA (diarias)'] = Math.round(hosp * 0.42 * 0.15); }
    if (d > 30) { const dm = day.getDate(); if (dm === 3) gastos['Servicios públicos'] = 1450000 + Math.round(R() * 120000); if (dm === 5) gastos['Servicios públicos'] = (gastos['Servicios públicos'] || 0) + 405000; if (dm === 6) gastos['Internet y telefonía'] = 189900; if (dm === 15) gastos['Comisiones OTA'] = 880000 + Math.round(R() * 150000); if (dm % 7 === 2) gastos.Mantenimiento = 60000 + Math.round(R() * 260000); if (dm % 5 === 1) gastos.Transporte = 15000 + Math.round(R() * 20000); if (dm === 12) gastos['Lavandería externa'] = 145000; if (dm === 14) gastos.Marketing = 250000; }
    h.push({ date, ing, imp, nights, dorm, priv, facturas: Math.round(nights * 0.55 + (bar + rest) / 45000), pagos, costo: Math.round(bar * 0.38 + rest * 0.42), gastos });
  }
  S.billing.history = h; S.billing.historyV = 2;
}

  const g = Object.entries(cur.gastos).sort((a, b) => b[1] - a[1])[0];
  return `En ${r.label} los ingresos suman ${money(cur.ingresos)}${d != null ? `, ${d >= 0 ? 'un aumento' : 'una caída'} de ${pct(Math.abs(d))} frente a ${r.cmp}` : ''}. ${top[0]} aporta el ${pct(cur.ingresos ? top[1] / cur.ingresos : 0)} de los ingresos.
La ocupación es de ${pct(cur.ocupacion)} con una tarifa promedio de ${money(cur.adr)} por cama-noche.
El resultado operativo estimado es ${money(cur.resultado)} (margen ${pct(cur.margenPct)})${g ? `; el gasto principal es ${g[0].toLowerCase()} con ${money(g[1])}` : ''}.
Hay ${money(cur.imp)} en impuestos recaudados que corresponden a la DIAN.`;
}
BIND.socios = (el) => {
  const P = S.partners, r = periodRange(P.period);
  $$('[data-pp]', el).forEach((b) => (b.onclick = () => { P.period = b.dataset.pp; PT.ai = null; save(); render(); }));
  const setCap = () => { P.dormBeds = Math.max(0, +$('#pt-dorm', el).value || 0); P.privRooms = Math.max(0, +$('#pt-priv', el).value || 0); P.beds = P.dormBeds + P.privRooms; log('socios.capacidad', `${P.dormBeds} camas + ${P.privRooms} privadas`); save(); render(); };
  $('#pt-dorm', el)?.addEventListener('change', setCap); $('#pt-priv', el)?.addEventListener('change', setCap);
  const curDays = dayBook(r.from, r.to), prevDays = dayBook(r.pFrom, r.pTo);
  const cur = sumBook(curDays), prev = sumBook(prevDays);
  const C = palette();
  const tot = (d) => LINES.reduce((a, l) => a + d.ing[l], 0);
  chart('p-daily', { type: 'line', data: { labels: curDays.map((d) => fdate(d.date + 'T12:00')), datasets: [
    { label: 'Este periodo', data: curDays.map(tot), borderColor: C[0], backgroundColor: fade(C[0]), fill: true },
    { label: 'Periodo de comparación', data: prevDays.slice(0, curDays.length).map(tot), borderColor: alpha(cv('--muted'), 0.6), borderDash: [4, 4], borderWidth: 1.6, fill: false } ] },
    options: { plugins: { legend: { position: 'top', align: 'end' }, tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${money(c.raw)}` } } }, scales: { x: {}, y: { beginAtZero: true, ticks: moneyTick } } } });
  const mix = LINES.filter((l) => cur.ing[l]);
  chart('p-mix', { type: 'doughnut', data: { labels: mix, datasets: [{ data: mix.map((l) => cur.ing[l]), backgroundColor: mix.map((l) => cv(LINE_COLOR[l])), spacing: 2 }] }, options: { cutout: '72%', interaction: { mode: 'nearest', intersect: true }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${c.label}: ${money(c.raw)}` } } } }, plugins: [centerText('ingresos', moneyK(cur.ingresos))] });
  // por mes: últimos 4 meses calendario
  const months = []; const t0 = d0(); for (let i = 3; i >= 0; i--) { const f = new Date(t0.getFullYear(), t0.getMonth() - i, 1), tt = i ? new Date(t0.getFullYear(), t0.getMonth() - i + 1, 0) : t0; months.push({ label: f.toLocaleDateString('es-CO', { month: 'short' }) + (i ? '' : ' (en curso)'), s: sumBook(dayBook(iso(f), iso(tt))) }); }
  chart('p-month', { type: 'bar', data: { labels: months.map((m) => m.label), datasets: LINES.map((l) => ({ label: l, data: months.map((m) => m.s.ing[l]), backgroundColor: cv(LINE_COLOR[l]), maxBarThickness: 46 })) }, options: { plugins: { legend: { position: 'top', align: 'end' }, tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${money(c.raw)}`, footer: (items) => 'Total: ' + money(items.reduce((a, i) => a + i.raw, 0)) } } }, scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: moneyTick } } } });
  const pays = Object.entries(cur.pagos).sort((a, b) => b[1] - a[1]);
  chart('p-pay', { type: 'bar', data: { labels: pays.map((x) => x[0]), datasets: [{ data: pays.map((x) => x[1]), backgroundColor: pays.map((_, i) => alpha(C[i % C.length], 0.85)), barThickness: 14 }] }, options: { indexAxis: 'y', plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${money(c.raw)} · ${pct(c.raw / pays.reduce((a, x) => a + x[1], 0))}` } } }, scales: { x: { beginAtZero: true, ticks: moneyTick }, y: {} } } });
  const ge = Object.entries(cur.gastos).sort((a, b) => b[1] - a[1]);
  chart('p-exp', { type: 'bar', data: { labels: ge.map((x) => x[0]), datasets: [{ data: ge.map((x) => x[1]), backgroundColor: alpha(C[3], 0.85), barThickness: 12 }] }, options: { indexAxis: 'y', plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ' ' + money(c.raw) } } }, scales: { x: { beginAtZero: true, ticks: moneyTick }, y: {} } } });

  $('#pt-ai', el).onclick = async () => {
    PT.aiBusy = true; render();
    const facts = { periodo: r.label, comparacion: r.cmp, ingresos: Math.round(cur.ingresos), ingresosAnterior: Math.round(prev.ingresos), porLinea: cur.ing, porLineaAnterior: prev.ing, resultado: Math.round(cur.resultado), resultadoAnterior: Math.round(prev.resultado), margen: +cur.margenPct.toFixed(3), ocupacion: +cur.ocupacion.toFixed(3), ocupacionAnterior: +prev.ocupacion.toFixed(3), adr: Math.round(cur.adr), adrAnterior: Math.round(prev.adr), gastos: cur.gastos, gastosAnterior: prev.gastos, ticket: Math.round(cur.ticket), impuestos: Math.round(cur.imp), perdidaInventario: S.recon?.totals.perdida || 0 };
    let text = null, by = 'reglas';
    try {
      const sample = await getSample();
      if (sample) { const out = await sample(`Eres asesor financiero de los socios de Capybara Hostel (Colombia, pesos COP). Con estos datos escribe en español, para socios no contables, 5 frases cortas: cómo va el negocio, qué explica el cambio frente al periodo de comparación, la línea que más aporta, un riesgo a vigilar y una recomendación concreta. No inventes datos. Sin títulos ni viñetas, una frase por línea.\n\nDATOS: ${JSON.stringify(facts)}`, { cache: { gcTime: 3600000 } }); text = out.text.trim(); by = 'ia'; }
    } catch (e) { if (e.code && !['not_granted', 'sampling_disabled', 'rate_limited'].includes(e.code)) toast('No se pudo usar la IA; se muestra el resumen con reglas.'); }
    PT.ai = { text: text || partnerText(cur, prev, r), by, ts: new Date().toISOString() }; PT.aiBusy = false; render();
  };
  $('#pt-xls', el).onclick = async () => {
    if (!window.XLSX) return toast('No se pudo cargar el generador de Excel.');
    const wb = XLSX.utils.book_new();
    const res = [['Capybara Hostel · Informe para socios'], [`Periodo: ${r.label} (${r.from} a ${r.to})`, '', `Comparación: ${r.cmp}`], [], ['Indicador', 'Periodo', 'Comparación', 'Variación'],
      ...[['Ingresos (sin impuestos)', cur.ingresos, prev.ingresos], ...LINES.map((l) => ['  ' + l, cur.ing[l], prev.ing[l]]), ['Costo de lo vendido', cur.costo, prev.costo], ['Margen bruto', cur.margenBruto, prev.margenBruto], ['Gastos', cur.gastosTotal, prev.gastosTotal], ['Resultado operativo', cur.resultado, prev.resultado], ['Impuestos recaudados', cur.imp, prev.imp], ['Facturas', cur.facturas, prev.facturas], ['Ticket promedio', Math.round(cur.ticket), Math.round(prev.ticket)], ['Camas-noche vendidas', cur.nights, prev.nights], ['Ocupación', cur.ocupacion, prev.ocupacion], ['Tarifa promedio (ADR)', Math.round(cur.adr), Math.round(prev.adr)], ['RevPAB', Math.round(cur.revpab), Math.round(prev.revpab)]].map(([k, a, b]) => [k, Math.round(a * 1000) / 1000, Math.round(b * 1000) / 1000, b ? Math.round(((a - b) / Math.abs(b)) * 1000) / 1000 : ''])];
    const ws1 = XLSX.utils.aoa_to_sheet(res); ws1['!cols'] = [{ wch: 30 }, { wch: 16 }, { wch: 16 }, { wch: 12 }];
    XLSX.utils.book_append_sheet(wb, ws1, 'Resumen');
    const dd = [['Fecha', ...LINES, 'Total ingresos', 'Impuestos', 'Camas-noche', 'Facturas', 'Costo de lo vendido', 'Gastos'], ...curDays.map((d) => [d.date, ...LINES.map((l) => d.ing[l]), tot(d), d.imp, d.nights, d.facturas, Math.round(d.costo), Object.values(d.gastos).reduce((a, b) => a + b, 0)])];
    const ws2 = XLSX.utils.aoa_to_sheet(dd); ws2['!cols'] = dd[0].map(() => ({ wch: 14 })); XLSX.utils.book_append_sheet(wb, ws2, 'Diario');
    const ws3 = XLSX.utils.aoa_to_sheet([['Categoría', 'Gasto'], ...Object.entries(cur.gastos).sort((a, b) => b[1] - a[1])]); ws3['!cols'] = [{ wch: 28 }, { wch: 14 }]; XLSX.utils.book_append_sheet(wb, ws3, 'Gastos');
    const filename = `informe-socios-capybara-${r.from}-a-${r.to}.xlsx`;
    const dl = await getDownloads();
    if (dl) { try { await dl.save({ filename, data: new Uint8Array(XLSX.write(wb, { type: 'array', bookType: 'xlsx' })) }); log('socios.informe', filename); return; } catch (e) { if (e.code === 'declined') return; } }
    navigator.clipboard.writeText(XLSX.utils.sheet_to_csv(ws1, { FS: '\t' })).then(() => toast('La descarga no está disponible aquí: copié el resumen para pegarlo en Excel.'), () => toast('La descarga no está disponible en esta vista.'));
  };
};

/* ---------- Caja del día en Facturación (cajeros, manager, admin) ---------- */
const _rFact = RENDER.facturacion;
RENDER.facturacion = () => {
  const html = _rFact();
  if (!can('caja.ver') || SH.tab !== 'ventas') return html;
  const today = iso(Date.now());
  const ls = S.billing.lines.filter((l) => l.date === today && invStatus(l.inv) === 'emitida');
  const mineOnly = me().role === 'CAJERO';
  const by = {}, pay = {}, invs = new Set(); let total = 0;
  for (const l of ls) { const who = S.billing.status[l.inv]?.by || '—'; if (mineOnly && who !== me().name) continue; const t = lineCalc(l).total; total += t; pay[l.pay] = (pay[l.pay] || 0) + t; by[who] = (by[who] || 0) + t; invs.add(l.inv); }
  const pend = S.billing.lines.filter((l) => invStatus(l.inv) === 'borrador').reduce((s, l) => s.add(l.inv), new Set()).size;
  const caja = `<div class="caja">
    <div class="caja-main"><span class="k">${mineOnly ? 'Mi caja de hoy' : 'Caja de hoy'}</span><span class="v">${money(total)}</span><span class="s">${invs.size} facturas emitidas · ${pend} en borrador</span></div>
    <div class="caja-pays">${['Efectivo', 'Tarjeta', 'Transferencia', 'Nequi', 'Daviplata', 'Cargo a la habitación'].filter((p) => pay[p]).map((p) => `<div><span class="k">${p}</span><b>${money(pay[p])}</b></div>`).join('') || '<span class="muted small">Aún no hay ventas emitidas hoy.</span>'}</div>
    ${!mineOnly && Object.keys(by).length ? `<div class="caja-who">${Object.entries(by).map(([w, v]) => `<span class="tag">${esc(w)} · ${moneyK(v)}</span>`).join(' ')}</div>` : ''}
    <button class="btn sm" id="caja-copy">${ic('copy')} Copiar cuadre</button></div>`;
  return caja + html;
};
const _bFact = BIND.facturacion;
BIND.facturacion = (el) => {
  _bFact(el);
  $('#caja-copy', el)?.addEventListener('click', () => {
    const today = iso(Date.now()); const mineOnly = me().role === 'CAJERO'; const pay = {}; let total = 0, n = new Set();
    for (const l of S.billing.lines) { if (l.date !== today || invStatus(l.inv) !== 'emitida') continue; if (mineOnly && S.billing.status[l.inv]?.by !== me().name) continue; const t = lineCalc(l).total; total += t; pay[l.pay] = (pay[l.pay] || 0) + t; n.add(l.inv); }
    const txt = `Cuadre de caja · ${fdate(today + 'T12:00')} · ${me().name}\nFacturas: ${n.size}\n${Object.entries(pay).map(([k, v]) => `${k}: ${money(v)}`).join('\n')}\nTotal: ${money(total)}`;
    navigator.clipboard.writeText(txt).then(() => toast('Cuadre copiado'), () => toast('No se pudo copiar.'));
    log('caja.cuadre', `${n.size} facturas · ${money(total)}`);
  });
};

/* ---------- modo API: facturas, usuarios y permisos reales ---------- */
const _remoteLoad = remote.load;
remote.load = async () => {
  await _remoteLoad();
  const tryGet = (p) => remote.req('/api/v1' + p).catch(() => null);
  const [rows, users, roles] = await Promise.all([tryGet('/invoices?format=rows'), tryGet('/users'), tryGet('/roles')]);
  if (rows) {
    const status = {};
    for (const r of rows) status[r.inv] = { st: r.status, by: r.issuedBy || '', alegra: r.alegra || null, invoiceId: r.invoiceId };
    const drafts = (S.billing?.lines || []).filter((l) => l.localDraft);
    S.billing = { next: 1, status, lines: [...rows.map((r) => ({ id: r.id, inv: r.inv, invoiceId: r.invoiceId, date: r.date, customer: r.customer, room: r.room || '', productId: r.productId, qty: r.qty, price: r.price, taxPct: r.taxPct, pay: r.pay })), ...drafts], draftPurchases: S.billing?.draftPurchases || [], history: [], historyV: 2 };
  }
  if (users) S.users = users.map((u) => ({ ...u, areas: u.areas || [] }));
  if (roles?.matrix) S.rolePerms = roles.matrix;
  S.alegra ||= null; S.imports ||= [];
  if (S.alegra) S.alegra.supplierLinks = Object.fromEntries(S.suppliers.map((s) => [s.id, s.alegraId || ''])); // vínculos reales del servidor
  if (S.alegra) S.alegra.itemLinks = Object.fromEntries(S.products.filter((p) => p.alegraItemId).map((p) => [p.id, String(p.alegraItemId)]));
  const itemRows = S.alegra ? await tryGet('/alegra/items/links') : null; // consulta el catálogo de Alegra (solo administradores)
  if (S.alegra && Array.isArray(itemRows)) S.alegra.items = itemRows.map((r) => ({ id: r.alegraItemId, name: r.alegraName, reference: r.reference || '' }));
};
const _newInvoice = newInvoice;
newInvoice = function () { _newInvoice(); if (S.settings.mode === 'api') { const l = S.billing.lines[S.billing.lines.length - 1]; l.localDraft = true; l.inv = 'BORRADOR-' + Date.now().toString(36).toUpperCase().slice(-4); save(); render(); } };
const _emitInvoice = emitInvoice;
emitInvoice = async function (inv) {
  if (S.settings.mode !== 'api') return _emitInvoice(inv);
  const lines = S.billing.lines.filter((l) => l.inv === inv);
  if (lines.some((l) => !l.productId || !(l.qty > 0))) return toast(`Completa producto y cantidad en todas las líneas de ${inv}.`);
  const body = { date: lines[0].date, customerName: lines[0].customer || 'Consumidor final', room: lines[0].room || undefined, payMethod: lines[0].pay, lines: lines.map((l) => ({ productId: l.productId, qty: +l.qty, price: +l.price, taxPct: +l.taxPct })) };
  try {
    const id = lines[0].invoiceId;
    const saved = id ? await remote.req(`/api/v1/invoices/${id}`, { method: 'PUT', body }) : await remote.req('/api/v1/invoices', { method: 'POST', body });
    const r = await remote.req(`/api/v1/invoices/${saved.id}/issue`, { method: 'POST' });
    S.billing.lines = S.billing.lines.filter((l) => l.inv !== inv);
    await remote.load(); save(); render();
    toast(`${saved.number} emitida${r.warnings?.length ? ' · ' + r.warnings.join('; ') : ''}`);
  } catch (e) { toast('No se pudo emitir: ' + e.message); }
};

/* ---------- arranque: si la página la sirve el backend, pide iniciar sesión ---------- */
function loginModal() {
  const m = modal({ title: 'Iniciar sesión en Capybara Control', body: `
    <div class="field"><label for="lg-email">Correo</label><input class="in" id="lg-email" type="email" autocomplete="username" value="${esc(S.settings.lastEmail || '')}"></div>
    <div class="field"><label for="lg-pw">Contraseña</label><input class="in" id="lg-pw" type="password" autocomplete="current-password"></div>
    <p class="muted small" id="lg-msg" style="margin:0">Servidor: <span class="mono">${esc(S.settings.baseUrl)}</span></p>`,
    foot: `<button class="btn" id="lg-demo">Ver demostración</button><button class="btn pri" id="lg-ok">Entrar</button>` });
  const go = async () => {
    const email = m.querySelector('#lg-email').value.trim(), pw = m.querySelector('#lg-pw').value;
    if (!email || !pw) return toast('Escribe tu correo y contraseña.');
    try { const d = await remote.login(email, pw); S.settings.lastEmail = email; await remote.load(); S.settings.mode = 'api'; S.recon = null; if (!S.users.some((u) => u.name === d.user.name)) S.users.push({ id: d.user.id, name: d.user.name, role: d.user.role, area: d.user.area || '', areas: [], email, active: true }); S.settings.user = d.user.name; save(); closeModal(); location.hash = homeView(); render(); toast(`Hola, ${d.user.name}`); }
    catch (e) { m.querySelector('#lg-msg').innerHTML = `<span class="neg">${esc(e.message)}</span>`; }
  };
  m.querySelector('#lg-ok').onclick = go;
  m.querySelector('#lg-pw').onkeydown = (e) => e.key === 'Enter' && go();
  m.querySelector('#lg-demo').onclick = () => { closeModal(); toast('Modo demostración: los datos de ejemplo viven solo en este navegador.'); };
}
boot();
if (window.CAPYBARA_API) {
  S.settings.baseUrl ||= window.CAPYBARA_API;
  if (!S.settings.token || S.settings.mode !== 'api') loginModal();
}
