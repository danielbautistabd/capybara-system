<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E4A37">
<link rel="manifest" href="manifest.webmanifest">
<script>window.CAPYBARA_API = location.origin;</script>
</head>
<body>
<title>Capybara Control</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Inventario, marchados, compras, gastos y conciliación de Capybara Hostel">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>/* Capybara Control — sidebar app shell; jungle-green rail, sand ground, mango for the one primary action */
:root{
  --jungle:#1E4A37; --jungle-2:#2B6A4E; --jungle-ink:#EAF2EC;
  --bg:#F4EEE2; --surface:#FFFFFF; --surface-2:#FAF6EE; --line:#E4DACA;
  --fg:#2A2219; --muted:#76695A; --bark:#7A5A43;
  --mango:#E58A2B; --mango-ink:#2A1606; --sun:#F2C14E;
  --ok:#2E8B57; --ok-bg:#E3F2E8; --warn:#B7791F; --warn-bg:#FBF0D9; --bad:#C0392B; --bad-bg:#FBE4E1; --info:#2F6F8F; --info-bg:#E2EFF5;
  --c1:#2B6A4E; --c2:#E58A2B; --c3:#7A5A43; --c4:#5B8FA8; --c5:#C9A227; --c6:#9C5B8E;
  --shadow:0 1px 2px rgba(42,34,25,.06),0 4px 14px rgba(42,34,25,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --jungle:#10261C; --jungle-2:#1F4D39; --jungle-ink:#DCEBE1;
  --bg:#141B16; --surface:#1C2620; --surface-2:#212D26; --line:#2F3D34;
  --fg:#EDE6D8; --muted:#A79C8B; --bark:#C9A787;
  --mango:#F0A04B; --mango-ink:#1E1004; --sun:#F2C14E;
  --ok:#5FC58A; --ok-bg:#1D3427; --warn:#E6B25A; --warn-bg:#3A2F1A; --bad:#F07A6C; --bad-bg:#3D2220; --info:#7FB8D4; --info-bg:#1D3039;
  --c1:#5FB88A; --c2:#F0A04B; --c3:#C9A787; --c4:#7FB8D4; --c5:#E2C25A; --c6:#C98DBB;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --jungle:#10261C; --jungle-2:#1F4D39; --jungle-ink:#DCEBE1;
  --bg:#141B16; --surface:#1C2620; --surface-2:#212D26; --line:#2F3D34;
  --fg:#EDE6D8; --muted:#A79C8B; --bark:#C9A787;
  --mango:#F0A04B; --mango-ink:#1E1004; --sun:#F2C14E;
  --ok:#5FC58A; --ok-bg:#1D3427; --warn:#E6B25A; --warn-bg:#3A2F1A; --bad:#F07A6C; --bad-bg:#3D2220; --info:#7FB8D4; --info-bg:#1D3039;
  --c1:#5FB88A; --c2:#F0A04B; --c3:#C9A787; --c4:#7FB8D4; --c5:#E2C25A; --c6:#C98DBB;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:700} h2{font-size:1.15rem;font-weight:650} h3{font-size:.98rem;font-weight:650}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--mango);outline-offset:2px;border-radius:6px}
svg[viewBox="0 0 24 24"]{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.num,td.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.82rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100%}
.side{background:var(--jungle);color:var(--jungle-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.12rem;display:block;line-height:1.05}
.brand span{font-size:.72rem;opacity:.7;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;opacity:.55;padding:14px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:inherit;text-decoration:none;font-size:.92rem;opacity:.86}
.nav a:hover{background:rgba(255,255,255,.07);opacity:1}
.nav a.on{background:rgba(255,255,255,.13);opacity:1;font-weight:600}
.nav a .ct{margin-left:auto;background:var(--mango);color:var(--mango-ink);font-size:.7rem;font-weight:700;border-radius:99px;padding:1px 7px;font-family:var(--f-mono)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;padding:14px 10px 4px;font-size:.78rem;opacity:.75;display:flex;flex-direction:column;gap:6px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top .ttl{min-width:0;flex:1}
.top .ttl h1{font-size:1.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none}
.top .hero .sm{display:none}
.content{padding-block:22px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1500px;width:100%}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 13px;border-radius:10px;cursor:pointer;font-weight:550;font-size:.88rem;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--bark)} .btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--jungle-2);border-color:var(--jungle-2);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.hero{background:var(--mango);border-color:var(--mango);color:var(--mango-ink);font-weight:750;letter-spacing:.02em;padding:10px 16px;font-size:.84rem;box-shadow:0 2px 0 color-mix(in srgb,var(--mango) 60%,#000)}
.btn.hero:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 9px;font-size:.8rem;border-radius:8px}
.btn.ok{color:var(--ok)} .btn.bad{color:var(--bad)} .btn.warn{color:var(--warn)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.btn.spin svg{animation:none}*{transition:none!important}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.76rem;color:var(--muted);font-weight:600}
.in,select.in,textarea.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
textarea.in{resize:vertical;min-height:70px}
.in:focus{border-color:var(--jungle-2);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--jungle-2) 20%,transparent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.spacer{flex:1}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:1.02rem}
.card-h .spacer{flex:1}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h p{margin:0}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.kpi .k{font-size:.76rem;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.32rem;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.74rem;color:var(--muted)}
.kpi.alert{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:linear-gradient(0deg,var(--bad-bg),var(--surface) 70%)}
.kpi.alert .v{color:var(--bad)}
.kpi.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.kpi.warn .v{color:var(--warn)}
.kpi.click{cursor:pointer} .kpi.click:hover{border-color:var(--bark)}
.kgroup{display:flex;flex-direction:column;gap:8px}
.kgroup>.eyebrow{padding-left:2px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.73rem;font-weight:650;border-radius:99px;padding:2px 9px;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--info-bg);color:var(--info)} .p-mut{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.tag{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.conf{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.78rem}
.conf i{display:block;width:46px;height:6px;border-radius:9px;background:var(--line);overflow:hidden;position:relative}
.conf i b{position:absolute;inset:0 auto 0 0;border-radius:9px}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;text-align:left;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
td .sub{display:block;font-size:.76rem;color:var(--muted)}
.neg{color:var(--bad)} .pos{color:var(--ok)}
.sev{border-left:3px solid transparent}
.sev-bad{border-left-color:var(--bad)} .sev-warn{border-left-color:var(--warn)} .sev-ok{border-left-color:var(--ok)}

/* ---------- charts ---------- */
.charts{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.ch{grid-column:span 6} .ch.w8{grid-column:span 8} .ch.w4{grid-column:span 4} .ch.w12{grid-column:span 12}
.ch canvas{width:100%!important;height:240px!important}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 10px;font-size:.78rem;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--jungle-2);color:#fff}

/* ---------- filters ---------- */
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-items:end}
details.fbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.fbox summary{cursor:pointer;font-weight:600;font-size:.9rem;display:flex;gap:8px;align-items:center}
details.fbox[open] summary{margin-bottom:10px}

/* ---------- lists / inbox ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar b{display:block;height:100%;background:var(--jungle-2);border-radius:9px}
.msg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px}
.bubble{background:color-mix(in srgb,var(--ok-bg) 70%,var(--surface));border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:.92rem;position:relative}
.bubble .meta{font-size:.74rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.bubble .att{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:.8rem}
.bubble .att svg{width:22px;height:22px;stroke:var(--bark);fill:none;stroke-width:1.7}
.prop{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.prop-row{display:grid;grid-template-columns:minmax(0,1.6fr) 70px 80px auto;gap:8px;align-items:center;font-size:.86rem}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.86rem;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--mango)}
.tabs button .ct{font-family:var(--f-mono);font-size:.72rem;margin-left:4px;opacity:.75}

/* ---------- formula strip ---------- */
.formula{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.84rem;background:var(--surface-2);border:1px dashed var(--bark);border-radius:12px;padding:10px 12px}
.formula .t{padding:3px 8px;border-radius:7px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.formula .op{font-family:var(--f-mono);color:var(--muted)}
.formula .t.res{background:var(--jungle-2);color:#fff;border-color:var(--jungle-2)}

/* ---------- modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,22,17,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal{background:var(--surface);border-radius:16px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:none}
.modal.wide{width:min(1040px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{flex:1}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:11px;font-size:.88rem;box-shadow:var(--shadow);animation:tin .2s ease-out}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:.9rem}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;background:var(--info-bg);color:var(--fg);font-size:.86rem;border:1px solid color-mix(in srgb,var(--info) 30%,transparent)}
.banner svg{flex:none;width:18px;height:18px;stroke:var(--info);fill:none;stroke-width:2;margin-top:2px}
.code{font-family:var(--f-mono);font-size:.78rem;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre;line-height:1.55}
.steps{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:20px;font-size:.88rem}
.thumb{width:40px;height:40px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:700;color:var(--bark);font-size:.8rem}

/* ---------- responsive ---------- */
@media (max-width:1100px){.ch,.ch.w8,.ch.w4{grid-column:span 12}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.msg{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:90;transform:translateX(-102%);transition:transform .2s ease;height:100%}
  .app.nav-open .side{transform:none}
  .app.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80}
  .menu-btn{display:inline-flex}
  .top .hero span.lg{display:none}
  .top .hero .sm{display:inline}
  .g3,.g2{grid-template-columns:1fr}
}
@media (max-width:560px){
  .g4{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kgroup .kpis .kpi:first-child{grid-column:1/-1}
  .prop-row{grid-template-columns:minmax(0,1fr) 60px 70px}
  .prop-row .conf{grid-column:1/-1}
  .top{gap:8px}
  .top .ttl h1{font-size:1.05rem}
  .hide-sm{display:none}
}
td select.in{min-width:160px}
td:first-child b{display:inline-block;min-width:150px}

body.no-money .money{display:none!important}
.ai-card{border-color:color-mix(in srgb,var(--jungle-2) 35%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--ok-bg) 55%,var(--surface)),var(--surface) 160px)}
.ai-card .card-h h2{display:flex;align-items:center;gap:8px}
.ai-card .card-h h2 svg{stroke:var(--mango)}
.ai-body{display:flex;flex-direction:column;gap:10px}
.ai-head{font-family:var(--f-display);font-size:1.2rem;font-weight:650;margin:0;text-wrap:balance}
.ai-points{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px;font-size:.9rem}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.rec{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);min-width:0}
.ai-wait{display:flex;align-items:center;gap:6px;padding:8px 0 12px}
.ai-wait .dot{width:7px;height:7px;border-radius:50%;background:var(--jungle-2);animation:blink 1.2s infinite ease-in-out}
.ai-wait .dot:nth-child(2){animation-delay:.15s}.ai-wait .dot:nth-child(3){animation-delay:.3s}
.ai-wait span.muted{margin-left:6px;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ai-wait .dot{animation:none}}
#as-user option{color:#2A2219}

/* ---------- hoja de cálculo (Facturación) ---------- */
:root{--gs-grid:#E2E3E3;--gs-head:#F8F9FA;--gs-sel:#1A73E8;--gs-sel-bg:#E8F0FE;--gs-ink:#202124;--gs-calc:#F6F8F6;--gs-paper:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gs-grid:#3A423D;--gs-head:#212A24;--gs-sel:#8AB4F8;--gs-sel-bg:#1E2D44;--gs-ink:#E8EAED;--gs-calc:#1F2822;--gs-paper:#18201B}}
:root[data-theme="dark"]{--gs-grid:#3A423D;--gs-head:#212A24;--gs-sel:#8AB4F8;--gs-sel-bg:#1E2D44;--gs-ink:#E8EAED;--gs-calc:#1F2822;--gs-paper:#18201B}
.gs{background:var(--gs-paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow)}
.gs-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--gs-grid);flex-wrap:wrap}
.gs-title{display:flex;align-items:center;gap:8px;min-width:0}
.gs-title svg{stroke:#1E8E3E;width:22px;height:22px}
.gs-title b{font-family:var(--f-body);font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-search{width:220px;max-width:100%;padding:5px 10px;border-radius:99px;background:var(--gs-head)}
.gs-tools{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--gs-head);border-bottom:1px solid var(--gs-grid);flex-wrap:wrap}
.gs-sep{width:1px;height:20px;background:var(--gs-grid);margin:0 4px}
.gs-fx{display:flex;align-items:stretch;border-bottom:1px solid var(--gs-grid);font-size:.84rem;min-height:30px}
.gs-ref{min-width:64px;padding:5px 10px;border-right:1px solid var(--gs-grid);color:var(--gs-ink);display:flex;align-items:center}
.gs-fxi{padding:5px 10px;color:var(--muted);font-style:italic;font-family:Georgia,serif;border-right:1px solid var(--gs-grid);display:flex;align-items:center}
.gs-fxv{padding:5px 10px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;color:var(--gs-ink)}
.gs-wrap{overflow:auto;max-height:min(62vh,640px);outline:none;position:relative}
.gs-wrap:focus-visible{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--gs-sel) 40%,transparent)}
.gs-t{border-collapse:separate;border-spacing:0;table-layout:fixed;font:13px/1.2 Arial,"Helvetica Neue",var(--f-body);color:var(--gs-ink);width:max-content}
.gs-t th,.gs-t td{border-right:1px solid var(--gs-grid);border-bottom:1px solid var(--gs-grid);padding:0 6px;height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--gs-paper);text-transform:none;letter-spacing:0;font-weight:400;position:static}
.gs-t thead th{position:sticky;top:0;z-index:3;background:var(--gs-head);color:var(--muted);text-align:center;font-size:11px;font-family:Arial,sans-serif}
.gs-t thead th.on{background:color-mix(in srgb,var(--gs-sel) 18%,var(--gs-head));color:var(--gs-ink);font-weight:700}
.gs-t .gs-rn{position:sticky;left:0;z-index:2;background:var(--gs-head);color:var(--muted);text-align:center;font-size:11px;padding:0;font-family:Arial,sans-serif}
.gs-t .gs-rn.on{background:color-mix(in srgb,var(--gs-sel) 18%,var(--gs-head));color:var(--gs-ink);font-weight:700}
.gs-t .gs-corner{position:sticky;left:0;top:0;z-index:4;background:var(--gs-head)}
.gs-t td.n{text-align:right;font-variant-numeric:tabular-nums}
.gs-t .gs-head td{font-weight:700;background:color-mix(in srgb,#1E8E3E 9%,var(--gs-paper));position:sticky;top:25px;z-index:2}
.gs-t .gs-head .gs-rn{top:25px;z-index:3}
.gs-t td.gs-calc{background:var(--gs-calc)}
.gs-t tr.gs-lock td{color:color-mix(in srgb,var(--gs-ink) 62%,transparent)}
.gs-t tr.gs-break td,.gs-t tr.gs-break th{border-top:2px solid color-mix(in srgb,var(--gs-grid) 60%,var(--muted))}
.gs-t td[data-r]{cursor:cell}
.gs-t td.sel{box-shadow:inset 0 0 0 2px var(--gs-sel);background:var(--gs-sel-bg)}
.gs-t td.sel:has(.gs-in){padding:0;background:var(--gs-paper)}
.gs-in{width:100%;height:24px;border:0;outline:2px solid var(--gs-sel);outline-offset:-2px;padding:0 6px;font:inherit;background:var(--gs-paper);color:var(--gs-ink)}
.gs-in.num{text-align:right}
.gs-t .gs-tot td{font-weight:700;background:var(--gs-head);border-top:2px solid var(--gs-grid)}
.gs-t .gs-empty td{background:var(--gs-paper)}
.gs-st-borrador{color:#B06000!important}.gs-st-emitida,.gs-st-aprobada{color:#1E8E3E!important}.gs-st-en-alegra{color:#1A73E8!important}.gs-st-nueva{color:#B06000!important}
.gs-tabs{display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--gs-head);border-top:1px solid var(--gs-grid);min-height:36px;flex-wrap:wrap}
.gs-tabs button{border:0;background:none;padding:8px 14px;font:500 13px Arial,var(--f-body);color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.gs-tabs button.on{background:var(--gs-paper);color:#1E8E3E;border-bottom-color:#1E8E3E;font-weight:700}
[hidden]{display:none!important}

/* =====================================================================
   Capa minimalista · mismos colores (selva, arena, café, mango), menos ruido:
   superficies planas, líneas finas, más aire, números en Figtree tabular
   ===================================================================== */
:root{
  --bg:#F6F2EA; --surface:#FFFFFF; --surface-2:#F9F6F0; --line:#ECE5D9; --fg:#2B241C; --muted:#8A7D6C;
  --jungle:#1F4A38; --jungle-2:#2D6B4F; --mango:#E8913A; --bark:#8A6A50;
  --ok:#2F8A5B; --ok-bg:#EAF4EE; --warn:#B7791F; --warn-bg:#FBF3E3; --bad:#C2412F; --bad-bg:#FCEBE8; --info:#3C7A99; --info-bg:#E9F2F7;
  --c1:#2D6B4F; --c2:#E8913A; --c3:#9A7458; --c4:#6A9BB3; --c5:#D2AE48; --c6:#A66C96;
  --shadow:none; --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111813; --surface:#172019; --surface-2:#1B251E; --line:#243028; --fg:#ECE6D9; --muted:#9C9282;
  --jungle:#0F241A; --jungle-2:#3A8061; --mango:#F0A04B; --bark:#C9A787;
  --ok:#62C08D; --ok-bg:#183024; --warn:#E3B05C; --warn-bg:#30281A; --bad:#EF7B6B; --bad-bg:#35201D; --info:#82B9D4; --info-bg:#1A2C35;
  --c1:#5DB68A; --c2:#F0A04B; --c3:#C9A787; --c4:#82B9D4; --c5:#E0C060; --c6:#C996BE; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#111813; --surface:#172019; --surface-2:#1B251E; --line:#243028; --fg:#ECE6D9; --muted:#9C9282;
  --jungle:#0F241A; --jungle-2:#3A8061; --mango:#F0A04B; --bark:#C9A787;
  --ok:#62C08D; --ok-bg:#183024; --warn:#E3B05C; --warn-bg:#30281A; --bad:#EF7B6B; --bad-bg:#35201D; --info:#82B9D4; --info-bg:#1A2C35;
  --c1:#5DB68A; --c2:#F0A04B; --c3:#C9A787; --c4:#82B9D4; --c5:#E0C060; --c6:#C996BE; --shadow:none;
}
body{font-size:14.5px;line-height:1.55}
.num,td.n{font-family:var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:-.005em}
.mono{font-family:var(--f-mono)}
h2{font-size:1.02rem;font-weight:600;letter-spacing:-.005em}
.eyebrow{font-size:.7rem;letter-spacing:.06em;font-weight:600}

/* menú lateral más liviano */
.side{background:var(--jungle);padding:22px 14px}
.brand{padding:2px 8px 22px}
.nav{gap:1px}
.nav .grp{font-size:.64rem;letter-spacing:.12em;opacity:.45;padding:18px 10px 6px}
.nav a{padding:8px 10px;font-size:.9rem;opacity:.78;border-radius:10px;transition:background .15s,opacity .15s}
.nav a.on{background:rgba(255,255,255,.1);font-weight:600;box-shadow:inset 3px 0 0 var(--mango)}
.nav a .ct{background:rgba(255,255,255,.16);color:inherit;font-family:var(--f-body);font-weight:600;padding:0 7px}
.nav a.on .ct{background:var(--mango);color:var(--mango-ink)}

/* barra superior limpia */
.top{background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid transparent;padding-block:16px}
.top .ttl h1{font-size:1.15rem;font-weight:650}
.btn{border-radius:10px;border-color:var(--line);background:var(--surface);font-weight:550;transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:color-mix(in srgb,var(--bark) 45%,var(--line));background:var(--surface-2)}
.btn.pri{background:var(--jungle-2);border-color:var(--jungle-2)}
.btn.hero{border-radius:999px;box-shadow:none;letter-spacing:.03em;font-size:.78rem;padding:9px 16px}
.btn.hero:hover{filter:brightness(1.04)}
.btn.sm{border-radius:8px}
.in,select.in,textarea.in{border-radius:10px;border-color:var(--line);background:var(--surface)}
.in.sm{width:auto;max-width:200px;padding:5px 8px;font-size:.84rem}

/* contenido con más aire */
.content{gap:20px;padding-block:8px 64px;max-width:1380px}
.card{border-color:var(--line);border-radius:var(--r);padding:20px;box-shadow:none}
.card-h{margin-bottom:14px}
.charts{gap:16px}
.ch canvas{height:230px!important}
.grid{gap:14px}

/* indicadores planos */
.kpis{gap:12px}
.kpi{border-color:var(--line);border-radius:14px;padding:14px 16px;background:var(--surface)}
.kpi .k{font-weight:500;font-size:.78rem}
.kpi .v{font-family:var(--f-display);font-weight:600;font-size:1.5rem;letter-spacing:-.02em}
.kpi.alert{background:var(--surface);border-color:var(--line)}
.kpi.alert .v{color:var(--bad)}
.kpi.alert .k::before,.kpi.warn .k::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--bad)}
.kpi.warn{border-color:var(--line)}
.kpi.warn .k::before{background:var(--warn)}
.kpi.warn .v{color:var(--fg)}

/* estados discretos */
.pill{border:0;padding:2px 9px 2px 8px;font-weight:600;font-size:.72rem}
.pill::before{width:5px;height:5px}
.p-mut{background:var(--surface-2);border:0}
.tag{border-radius:6px;background:var(--surface-2);border-color:transparent}

/* tablas aireadas */
.tbl-wrap{border-color:var(--line);border-radius:14px}
th{background:var(--surface);color:var(--muted);font-weight:600;font-size:.7rem;letter-spacing:.05em;padding:11px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
tbody tr:hover td{background:var(--surface-2)}
.sev{border-left-width:2px}
.formula{border-style:solid;border-color:var(--line);background:var(--surface-2)}
.formula .t{background:var(--surface);border-color:var(--line);font-weight:500}
.banner{border-radius:14px;border-color:transparent}
.tabs{border-bottom-color:var(--line)}
.tabs button{font-weight:550}
.tabs button.on{border-bottom-width:2px}
.seg{border-color:var(--line);border-radius:10px;padding:2px;background:var(--surface-2);gap:2px}
.seg button{border-radius:8px;background:transparent;font-weight:550;padding:4px 11px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
details.fbox{border-color:var(--line);border-radius:12px;padding:8px 14px}
.prop{background:var(--surface-2);border-color:var(--line)}
.bubble{border-color:transparent}
.li{border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);padding:10px 0}
.bar{height:5px;background:color-mix(in srgb,var(--line) 80%,transparent)}
.thumb{border-color:transparent;border-radius:10px}
.modal{border-radius:18px}
.toast{border-radius:12px}

/* tablero */
.greet{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;justify-content:space-between}
.greet h2{font-family:var(--f-display);font-size:1.55rem;font-weight:650;letter-spacing:-.02em}
.greet p{margin:2px 0 0;font-size:.9rem}
.greet p::first-letter{text-transform:uppercase}
.greet .fbox{flex:0 1 auto;max-width:100%}
.greet .fbox[open]{flex:1 1 100%}
.greet .fbox summary{font-size:.84rem;font-weight:550;color:var(--muted)}
.heroes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.hero-kpi{display:flex;flex-direction:column;gap:2px;padding:18px 20px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);color:inherit;text-decoration:none;min-width:0;overflow:hidden;position:relative;transition:border-color .15s}
.hero-kpi:hover{border-color:color-mix(in srgb,var(--bark) 40%,var(--line))}
.hero-kpi .k{font-size:.8rem;color:var(--muted);font-weight:500}
.hero-kpi .v{font-family:var(--f-display);font-size:2rem;font-weight:650;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero-kpi .s{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:12px}
.hero-kpi.is-bad .v{color:var(--bad)}
.hero-kpi:not(:has(.spark)){padding-bottom:6px}
.spark{display:block;width:calc(100% + 40px);height:44px;margin:0 -20px}
.stats{display:flex;flex-direction:column}
.stat{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);color:inherit;text-decoration:none;font-size:.88rem}
.stat:last-child{border-bottom:0}
.stat:hover .l{color:var(--jungle-2)}
.stat .l{flex:1;min-width:0}
.stat .r{text-align:right;display:flex;flex-direction:column;line-height:1.2}
.stat .r b{font-weight:600;font-variant-numeric:tabular-nums}
.stat .r small{color:var(--muted);font-size:.72rem}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.count{font-size:.74rem;font-weight:600;background:var(--bad-bg);color:var(--bad);border-radius:99px;padding:1px 8px}
.attn .li{color:inherit;text-decoration:none;gap:10px}
.attn .li:hover .grow{color:var(--jungle-2)}
.chev{color:var(--muted);font-size:1.1rem;line-height:1}
.rank .pos{width:20px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.rank .li b{font-weight:550}
.rank .bar{margin-top:5px}
@media (max-width:1100px){.heroes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.heroes{grid-template-columns:1fr 1fr;gap:10px}.hero-kpi{padding:14px 14px 0}.hero-kpi .v{font-size:1.45rem}.spark{width:calc(100% + 28px);margin:0 -14px;height:34px}.greet h2{font-size:1.3rem}.card{padding:16px}}
.ch.w8 canvas{height:330px!important}
.ch.w4 canvas{height:250px!important}
.pcell{min-width:230px;display:block}
.pcell .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
td:first-child b{min-width:0}
td:first-child:has(.sub) b{min-width:150px}

/* ---------- Importar Excel ---------- */
.im-intro{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:stretch}
.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:260px;padding:28px;border:1.5px dashed color-mix(in srgb,var(--jungle-2) 45%,var(--line));border-radius:var(--r);background:color-mix(in srgb,var(--ok-bg) 45%,var(--surface));cursor:pointer;transition:background .15s,border-color .15s}
.dropzone:hover,.dropzone.over{background:var(--ok-bg);border-color:var(--jungle-2)}
.dropzone.busy{opacity:.7;pointer-events:none}
.dropzone b{font-size:1.02rem;font-weight:600}
.dz-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--jungle-2);margin-bottom:4px}
.dz-ic svg{width:26px;height:26px;stroke-width:1.8}
.im-file .row{gap:14px}
.im-skip td{color:var(--muted)}
.im-radio{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;cursor:pointer}
.im-radio:has(input:checked){border-color:var(--jungle-2);background:color-mix(in srgb,var(--ok-bg) 50%,var(--surface))}
.im-radio input{margin-top:3px}
.im-radio span{display:flex;flex-direction:column;font-size:.86rem}
.im-radio small{color:var(--muted);font-size:.76rem}
.chg{font-size:.82rem;line-height:1.45}
.chg s{color:var(--muted)}
.im-done{text-align:center;padding:32px 20px}
.im-check{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 10px}
.im-check svg{width:28px;height:28px;stroke-width:2.4}
@media (max-width:860px){.im-intro{grid-template-columns:1fr}}

/* ---------- Socios ---------- */
.hero-kpi.pt{padding-bottom:4px}
.dl{font-size:.76rem;font-weight:600;color:var(--muted);white-space:nowrap}
.dl.up{color:var(--ok)}.dl.down{color:var(--bad)}
.pnl{display:flex;flex-direction:column}
.pl{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);font-size:.9rem}
.pl b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pl.neg-row b{color:var(--muted);font-weight:500}
.pl.small{font-size:.82rem;padding:5px 0 5px 12px}
.pl.sub{font-weight:600;border-bottom-color:var(--line)}
.pl.total{border-bottom:0;border-top:2px solid var(--fg);margin-top:4px;padding-top:10px;font-weight:650;font-size:1rem}
.pl.total b{color:var(--ok)}.pl.total.is-neg b{color:var(--bad)}
.kpi-strip{padding:14px}
.kpi-strip .kpis{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.kpi-strip .kpi{border:0;padding:6px 10px;background:transparent}
.kpi-strip .kpi + .kpi{border-left:1px solid var(--line);border-radius:0}
.pt-ai{font-size:.98rem;line-height:1.7;max-width:80ch}
/* ---------- Caja del día ---------- */
.caja{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.caja-main{display:flex;flex-direction:column;min-width:160px}
.caja-main .k,.caja-pays .k{font-size:.76rem;color:var(--muted)}
.caja-main .v{font-family:var(--f-display);font-size:1.6rem;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.caja-main .s{font-size:.76rem;color:var(--muted)}
.caja-pays{display:flex;gap:22px;flex-wrap:wrap;flex:1}
.caja-pays div{display:flex;flex-direction:column}
.caja-pays b{font-weight:600;font-variant-numeric:tabular-nums}
.caja-who{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:560px){.kpi-strip .kpi + .kpi{border-left:0}.caja{gap:12px}}

/* Supabase: capa de carga */
.cloud-ov{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);padding:16px}
.cloud-ov .card{display:grid;gap:6px;max-width:340px;text-align:center}

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
/* =====================================================================
 * Capybara Control — núcleo compartido (backend + frontend)
 * ---------------------------------------------------------------------
 *  - parseInstruction(): interpreta mensajes tipo "Marchar 3 cervezas y 2 aguas"
 *  - fingerprint() / findDuplicates(): evita registrar el mismo movimiento
 *    que llega por WhatsApp, foto, factura y fila de Excel
 *  - theoreticalStock() / reconcile(): motor de conciliación
 *  - weightedAvgCost(): costo promedio ponderado
 * Sin dependencias. El build del frontend incrusta este archivo quitando
 * las palabras "export".
 * ===================================================================== */

const AUTO_APPLY_CONFIDENCE = 0.85;

/* Tipos de movimiento y su signo sobre el inventario */
const MOVEMENT_TYPES = {
  entrada:         { label: 'Entrada',          sign: +1 },
  devolucion:      { label: 'Devolución',       sign: +1 },
  ajuste_pos:      { label: 'Ajuste (+)',       sign: +1 },
  salida:          { label: 'Salida',           sign: -1 },
  marchado:        { label: 'Marchado',         sign: -1 },
  consumo_interno: { label: 'Consumo interno',  sign: -1 },
  cortesia:        { label: 'Cortesía',         sign: -1 },
  danado:          { label: 'Dañado',           sign: -1 },
  vencido:         { label: 'Vencido',          sign: -1 },
  perdida:         { label: 'Pérdida',          sign: -1 },
  ajuste_neg:      { label: 'Ajuste (−)',       sign: -1 },
};

/* ---------------------------------------------------------------- texto */
function normalize(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9ñ\s.,/]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function singular(w) {
  if (w.length <= 3) return w;
  if (/ces$/.test(w)) return w.slice(0, -3) + 'z';      // luces -> luz
  if (/(a|e|i|o|u)s$/.test(w)) return w.slice(0, -1);   // cervezas -> cerveza
  if (/(r|l|n|d|j)es$/.test(w)) return w.slice(0, -2);  // limones -> limon
  return w;
}

const NUMBER_WORDS = {
  un: 1, uno: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7,
  ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12, quince: 15, veinte: 20,
  treinta: 30, cuarenta: 40, cincuenta: 50, media: 0.5, medio: 0.5,
  docena: 12, par: 2,
};

/* Verbos → tipo de movimiento (orden = prioridad) */
const VERB_RULES = [
  { re: /\b(cortesia|regal(o|ar|ado)|invita(r|cion))\b/, type: 'cortesia', w: 0.95 },
  { re: /\b(se )?(dan(o|aron|ado|ados|ada|adas)|romp(io|ieron)|rot[oa]s?|quebr(o|aron|ado|ados)|partio)\b/, type: 'danado', w: 0.95 },
  { re: /\b(venci(o|eron|do|dos|da|das)|caduc(o|aron|ado))\b/, type: 'vencido', w: 0.95 },
  { re: /\b(perd(io|ieron|ida|ido)|extravi(o|aron|ado|ados)|falta(n)?|robar?on|no aparece(n)?)\b/, type: 'perdida', w: 0.9 },
  { re: /\b(devol(vio|vieron|ver|ucion)|regres(o|aron|ar))\b/, type: 'devolucion', w: 0.9 },
  { re: /\b(lleg(o|aron)|recibi(mos|o|eron)?|compr(e|amos|aron|o)|ingres(o|aron|ar)|entr(o|aron)|surtir)\b/, type: 'entrada', w: 0.9 },
  { re: /\b(utiliz(o|aron|ar|amos)|us(o|aron|ar|amos)|se usaron|consum(io|ieron|ir|imos)|gast(o|aron|amos))\b/, type: 'consumo_interno', w: 0.9 },
  { re: /\b(march(a|ar|ame|en|o|aron|ado|ados)|envi(a|ar|o|aron|en)|entreg(a|ar|o|aron|ue|uen)|sac(a|ar|o|aron|amos)|despach(a|ar|o|aron)|llev(a|ar|o|aron)|baj(a|ar|o|aron)|retir(a|ar|o|aron)|pas(a|ar|o|aron))\b/, type: 'marchado', w: 0.92 },
];

const AREA_RULES = [
  { re: /\bhabitacion(?:es)? ?(\d{1,4})\b/, area: (m) => `Habitación ${m[1]}` },
  { re: /\bhab\.? ?(\d{1,4})\b/, area: (m) => `Habitación ${m[1]}` },
  { re: /\bdorm(?:itorio)? ?(\d{1,3})\b/, area: (m) => `Dormitorio ${m[1]}` },
  { re: /\b(cocina)\b/, area: () => 'Cocina' },
  { re: /\b(bar|barra)\b/, area: () => 'Bar' },
  { re: /\b(limpieza|aseo|housekeeping)\b/, area: () => 'Limpieza' },
  { re: /\b(recepcion)\b/, area: () => 'Recepción' },
  { re: /\b(lavanderia)\b/, area: () => 'Lavandería' },
  { re: /\b(piscina|terraza|rooftop)\b/, area: (m) => m[1][0].toUpperCase() + m[1].slice(1) },
  { re: /\b(mantenimiento)\b/, area: () => 'Mantenimiento' },
];

const STOP = new Set(['de', 'del', 'la', 'el', 'los', 'las', 'para', 'a', 'al', 'en', 'con', 'por', 'se', 'y', 'e', 'que', 'mas', 'porfa', 'favor', 'por favor', 'unidad', 'unidades', 'und', 'un', 'una', 'uno']);

function levenshtein(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
function wordSim(a, b) {
  if (a === b) return 1;
  if (a.length >= 4 && b.length >= 4 && (a.startsWith(b) || b.startsWith(a))) return 0.9;
  const d = levenshtein(a, b);
  return Math.max(0, 1 - d / Math.max(a.length, b.length));
}
// medidas que aparecen en el nombre ("600 ml", "2 kg") y no ayudan a identificar el producto
const SIZE = new Set(['ml', 'g', 'gr', 'kg', 'l', 'lt', 'oz', 'cm', 'mm', 'm', 'x', 'aa', 'aaa']);
function tokens(s) {
  return normalize(s).split(' ').filter((w) => w && !STOP.has(w) && !SIZE.has(w) && !/^\d+([.,]\d+)?$/.test(w)).map(singular);
}

/**
 * Busca el producto del catálogo que mejor coincide con un fragmento de texto.
 * Usa nombre + alias. Devuelve { product, score } o null.
 */
function matchProduct(fragment, catalog) {
  const ft = tokens(fragment);
  if (!ft.length) return null;
  let best = null;
  for (const p of catalog) {
    if (p.status === 'inactivo') continue;
    const names = [p.name, ...(p.aliases || [])];
    for (const nm of names) {
      const pt = tokens(nm);
      if (!pt.length) continue;
      // cobertura: qué tanto del nombre del producto aparece en el fragmento
      let sum = 0;
      for (const t of pt) sum += Math.max(...ft.map((f) => wordSim(f, t)));
      const coverage = sum / pt.length;
      // precisión: qué tanto del fragmento corresponde al producto
      let sum2 = 0;
      for (const f of ft) sum2 += Math.max(...pt.map((t) => wordSim(f, t)));
      const precision = sum2 / ft.length;
      const score = 0.7 * coverage + 0.3 * precision;
      if (!best || score > best.score) best = { product: p, score };
    }
  }
  return best && best.score >= 0.55 ? best : null;
}

function readQty(frag) {
  const m = frag.match(/(\d+(?:[.,]\d+)?)/);
  if (m) return { qty: parseFloat(m[1].replace(',', '.')), certain: true, rest: frag.replace(m[0], ' ') };
  const words = frag.split(' ');
  for (let i = 0; i < words.length; i++) {
    const w = words[i];
    if (w in NUMBER_WORDS) {
      let q = NUMBER_WORDS[w];
      if ((w === 'docena' || w === 'par') && i > 0 && words[i - 1] in NUMBER_WORDS) continue;
      if (w === 'media' && words[i + 1] === 'docena') { q = 6; words.splice(i + 1, 1); }
      else if (i + 1 < words.length && (words[i + 1] === 'docena' || words[i + 1] === 'docenas')) { q *= 12; words.splice(i + 1, 1); }
      else if (i + 1 < words.length && (words[i + 1] === 'par' || words[i + 1] === 'pares')) { q *= 2; words.splice(i + 1, 1); }
      words.splice(i, 1);
      return { qty: q, certain: true, rest: words.join(' ') };
    }
  }
  return { qty: 1, certain: false, rest: frag };
}

const UNIT_RULES = [
  [/\b(kilo|kilos|kg|kgs)\b/, 'kg'], [/\b(gramo|gramos|gr|g)\b/, 'g'],
  [/\b(litro|litros|lt|l)\b/, 'L'], [/\b(ml)\b/, 'ml'],
  [/\b(caja|cajas)\b/, 'caja'], [/\b(paquete|paquetes|paq)\b/, 'paquete'],
  [/\b(bolsa|bolsas)\b/, 'bolsa'], [/\b(botella|botellas)\b/, 'botella'],
  [/\b(lata|latas)\b/, 'lata'], [/\b(rollo|rollos)\b/, 'rollo'],
];

/**
 * Interpreta una instrucción de operación en lenguaje natural.
 * @param {string} text   Mensaje original
 * @param {Array} catalog Productos [{id,name,aliases,unit,status}]
 * @returns {{type, typeConfidence, area, items:[{productId, productName, rawText, qty, unit, confidence, matched}], confidence}}
 */
function parseInstruction(text, catalog) {
  const n = normalize(text);
  let type = null, tw = 0.6;
  for (const r of VERB_RULES) { if (r.re.test(n)) { type = r.type; tw = r.w; break; } }
  if (!type) { type = 'marchado'; tw = 0.6; } // por defecto en el hostel "marchar"

  let area = null;
  for (const r of AREA_RULES) { const m = n.match(r.re); if (m) { area = r.area(m); break; } }

  // quitar verbos y destino para aislar la lista de productos
  let body = n;
  for (const r of VERB_RULES) body = body.replace(r.re, ' ');
  body = body
    .replace(/\b(a|para|en|hacia) (la |el )?(habitacion(es)?|hab\.?|dorm(itorio)?) ?\d{1,4}\b/g, ' ')
    .replace(/\b(habitacion(es)?|hab\.?) ?\d{1,4}\b/g, ' ')
    .replace(/\b(para|en|a|al|del|de la) (la |el )?(cocina|bar|barra|limpieza|aseo|recepcion|lavanderia|piscina|terraza|rooftop|mantenimiento)\b/g, ' ')
    .replace(/\bcomo\b/g, ' ')
    .replace(/\bse\b/g, ' ');

  const parts = body.split(/,|;|\by\b|\be\b|\+|\n|\bmas\b/).map((s) => s.trim()).filter(Boolean);
  const items = [];
  for (const part of parts) {
    const { qty, certain, rest } = readQty(part);
    let unit = null;
    for (const [re, u] of UNIT_RULES) if (re.test(rest)) { unit = u; break; }
    const m = matchProduct(rest, catalog);
    if (!m && !tokens(rest).length) continue;
    const qtyConf = certain ? 1 : 0.7;
    const conf = m ? Math.min(1, m.score) * qtyConf * tw : 0.3 * qtyConf * tw;
    items.push({
      productId: m ? m.product.id : null,
      productName: m ? m.product.name : null,
      rawText: part,
      qty,
      unit: unit || (m ? m.product.unit : 'unidad'),
      confidence: Math.round(conf * 100) / 100,
      matched: !!m,
    });
  }
  const confidence = items.length ? Math.min(...items.map((i) => i.confidence)) : 0;
  return { type, typeConfidence: tw, area, items, confidence };
}

/* ------------------------------------------------- deduplicación */
function dayKey(ts) { return new Date(ts).toISOString().slice(0, 10); }

/** Huella estable de un movimiento: producto + tipo + cantidad + día (+ factura) */
function fingerprint(m) {
  const base = [m.productId, m.type, Number(m.qty).toFixed(3), dayKey(m.ts), (m.invoice || '').toUpperCase().replace(/\s/g, '')].join('|');
  let h = 2166136261; // FNV-1a
  for (let i = 0; i < base.length; i++) { h ^= base.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16).padStart(8, '0');
}

/**
 * Detecta posibles duplicados entre fuentes (WhatsApp, foto, factura, Sheets, manual).
 * Dos movimientos son candidatos si: mismo producto, mismo signo, misma cantidad,
 * y diferencia de tiempo <= windowHours; o misma factura y mismo producto.
 * Devuelve [{a, b, reason, score}]
 */
function findDuplicates(candidate, existing, windowHours = 12) {
  const out = [];
  const sc = MOVEMENT_TYPES[candidate.type]?.sign;
  for (const e of existing) {
    if (e.id === candidate.id || e.status === 'anulado' || e.status === 'rechazado') continue;
    if (e.productId !== candidate.productId) continue;
    if (MOVEMENT_TYPES[e.type]?.sign !== sc) continue;
    const dt = Math.abs(new Date(e.ts) - new Date(candidate.ts)) / 36e5;
    if (candidate.invoice && e.invoice && candidate.invoice.toUpperCase() === e.invoice.toUpperCase()) {
      out.push({ a: candidate, b: e, reason: 'Misma factura y producto', score: 0.98 }); continue;
    }
    if (Number(e.qty) === Number(candidate.qty) && dt <= windowHours) {
      const crossSource = e.source !== candidate.source;
      // misma fuente y < 1 h: casi seguro un reenvío; distinta fuente: el mismo hecho reportado dos veces
      const base = crossSource ? 0.93 : dt <= 1 ? 0.92 : 0.75;
      const score = base - dt / (windowHours * 10);
      out.push({ a: candidate, b: e, reason: crossSource ? `Mismo movimiento desde ${e.source}` : 'Movimiento repetido en la misma fuente', score: Math.round(score * 100) / 100 });
    }
  }
  return out.sort((x, y) => y.score - x.score);
}

/* ------------------------------------------------- costo promedio */
function weightedAvgCost(stock, avgCost, qtyIn, unitCost) {
  const s = Math.max(0, stock);
  if (s + qtyIn <= 0) return unitCost;
  return (s * avgCost + qtyIn * unitCost) / (s + qtyIn);
}

/* ------------------------------------------------- conciliación */
/**
 * Inventario teórico = inicial + entradas aprobadas + devoluciones
 *   − salidas − marchados − daños − vencimientos − pérdidas (± ajustes)
 * Solo cuentan movimientos con status 'aprobado'.
 */
function theoreticalStock(product, movements, untilTs = null) {
  const b = { inicial: Number(product.stockInit) || 0, entradas: 0, devoluciones: 0, salidas: 0, marchados: 0, consumos: 0, cortesias: 0, danos: 0, vencidos: 0, perdidas: 0, ajustes: 0 };
  for (const m of movements) {
    if (m.productId !== product.id || m.status !== 'aprobado') continue;
    if (untilTs && new Date(m.ts) > new Date(untilTs)) continue;
    const q = Number(m.qty) || 0;
    switch (m.type) {
      case 'entrada': b.entradas += q; break;
      case 'devolucion': b.devoluciones += q; break;
      case 'salida': b.salidas += q; break;
      case 'marchado': b.marchados += q; break;
      case 'consumo_interno': b.consumos += q; break;
      case 'cortesia': b.cortesias += q; break;
      case 'danado': b.danos += q; break;
      case 'vencido': b.vencidos += q; break;
      case 'perdida': b.perdidas += q; break;
      case 'ajuste_pos': b.ajustes += q; break;
      case 'ajuste_neg': b.ajustes -= q; break;
    }
  }
  b.teorico = b.inicial + b.entradas + b.devoluciones + b.ajustes - b.salidas - b.marchados - b.consumos - b.cortesias - b.danos - b.vencidos - b.perdidas;
  return b;
}

const RECON_STATUS = {
  coincide: 'Coincide',
  menor: 'Diferencia menor',
  importante: 'Diferencia importante',
  duplicado: 'Movimiento duplicado',
  sin_respaldo: 'Movimiento sin respaldo',
  no_registrado: 'Producto no registrado',
  sin_conteo: 'Sin conteo físico',
};

/**
 * Concilia todo el catálogo.
 * @param {object} p { products, movements, counts:[{productId, qty, ts}], unmatched:[{rawText, source}], minorPct=0.05, minorAbs=1 }
 * @returns {rows, totals}
 */
function reconcile({ products, movements, counts, unmatched = [], minorPct = 0.05, minorAbs = 1 }) {
  const rows = [];
  const lastCount = {};
  for (const c of counts) if (!lastCount[c.productId] || new Date(c.ts) > new Date(lastCount[c.productId].ts)) lastCount[c.productId] = c;

  for (const p of products) {
    if (p.status === 'inactivo') continue;
    const count = lastCount[p.id];
    const t = theoreticalStock(p, movements, count ? count.ts : null);
    const pm = movements.filter((m) => m.productId === p.id && m.status === 'aprobado');
    const dups = [];
    for (let i = 0; i < pm.length; i++) {
      const d = findDuplicates(pm[i], pm.slice(i + 1), 6);
      if (d.length && d[0].score >= 0.8) dups.push(d[0]);
    }
    // sin respaldo: reportes informales (WhatsApp) aprobados sin evidencia ni fila de hoja que los soporte
    const noBacking = pm.filter((m) => !m.evidence && !m.importRef && !m.importRowId && String(m.source).startsWith('whatsapp'));
    const physical = count ? Number(count.qty) : null;
    const diff = physical === null ? null : physical - t.teorico;
    const value = diff === null ? 0 : diff * (Number(p.avgCost) || 0);
    let status;
    if (physical === null) status = 'sin_conteo';
    else if (dups.length && diff !== 0) status = 'duplicado';
    else if (diff === 0) status = 'coincide';
    else if (noBacking.length && Math.abs(diff) > minorAbs) status = 'sin_respaldo';
    else if (Math.abs(diff) <= Math.max(minorAbs, Math.abs(t.teorico) * minorPct)) status = 'menor';
    else status = 'importante';
    rows.push({ productId: p.id, name: p.name, category: p.category, unit: p.unit, ...t, fisico: physical, diferencia: diff, valor: Math.round(value), status, duplicates: dups, sinRespaldo: noBacking.length, countTs: count?.ts || null });
  }
  for (const u of unmatched) {
    rows.push({ productId: null, name: u.rawText, category: '—', unit: '—', teorico: null, fisico: null, diferencia: null, valor: 0, status: 'no_registrado', source: u.source });
  }
  const totals = rows.reduce((acc, r) => {
    acc[r.status] = (acc[r.status] || 0) + 1;
    if (r.valor < 0) acc.perdida += -r.valor; else acc.sobrante += r.valor;
    return acc;
  }, { perdida: 0, sobrante: 0 });
  return { rows, totals };
}

/* =====================================================================
 * Capybara Control — inteligencia de inventario (backend + frontend)
 *  - consumptionStats(): consumo diario promedio y variabilidad
 *  - reorderPlan(): stock de seguridad, punto de reorden, cobertura y cantidad sugerida
 *  - purchaseSignals(): señales de compra y de riesgo
 *  - suggestedOrders(): órdenes sugeridas agrupadas por proveedor
 *  - buildDigest() / ruleSummary(): datos compactos para la IA y resumen sin IA
 * Depende de core.js (MOVEMENT_TYPES). Sin otras dependencias.
 * ===================================================================== */


const DAYMS = 864e5;
const OUT_TYPES = new Set(['salida', 'marchado', 'consumo_interno', 'cortesia', 'danado', 'vencido', 'perdida']);
const LOSS_TYPES = new Set(['danado', 'vencido', 'perdida']);
const startOfDay = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };

/** Nivel de servicio → z (probabilidad de no quedarse sin stock durante la reposición) */
const SERVICE_Z = { 0.9: 1.28, 0.95: 1.65, 0.98: 2.05, 0.99: 2.33 };

/**
 * Consumo diario del producto en los últimos `days` días.
 * avgDaily combina la última semana (60 %) con el periodo completo (40 %) para reaccionar a cambios
 * de temporada sin perder estabilidad.
 */
function consumptionStats(productId, movements, { days = 28, now = Date.now() } = {}) {
  const end = startOfDay(now) + DAYMS;
  const start = end - days * DAYMS;
  const daily = new Array(days).fill(0);
  let losses = 0, lossQty = 0;
  for (const m of movements) {
    if (m.productId !== productId || m.status !== 'aprobado' || !OUT_TYPES.has(m.type)) continue;
    const t = new Date(m.ts).getTime();
    if (t < start || t >= end) continue;
    daily[Math.floor((t - start) / DAYMS)] += Number(m.qty) || 0;
    if (LOSS_TYPES.has(m.type)) { lossQty += Number(m.qty) || 0; losses++; }
  }
  const sum = daily.reduce((a, b) => a + b, 0);
  const avgAll = sum / days;
  const last7 = daily.slice(-7).reduce((a, b) => a + b, 0) / 7;
  const avgDaily = 0.6 * last7 + 0.4 * avgAll;
  const sd = Math.sqrt(daily.reduce((a, v) => a + (v - avgAll) ** 2, 0) / Math.max(1, days - 1));
  const last2 = daily.slice(-2).reduce((a, b) => a + b, 0) / 2;
  return { avgDaily, avgAll, last7, last2, sd, total: sum, activeDays: daily.filter(Boolean).length, lossQty, losses, daily };
}

/**
 * Plan de reposición por producto.
 * Stock de seguridad  SS  = z · σ · √L
 * Punto de reorden    ROP = consumo diario · L + SS   (nunca menor que el stock mínimo)
 * Cobertura                = stock ÷ consumo diario (días)
 * Cantidad sugerida        = objetivo − stock − en camino, redondeada al empaque
 *   objetivo = max(stock máximo, ROP + consumo diario · días de revisión)
 * @param {object} o
 *   products, movements, stockOf(p), leadDays(p) (días de entrega del proveedor),
 *   onOrder {productId: qty}, service (0.95), reviewDays (7), now
 */
function reorderPlan({ products, movements, stockOf, leadDays = () => 2, onOrder = {}, service = 0.95, reviewDays = 7, now = Date.now() }) {
  const z = SERVICE_Z[service] ?? 1.65;
  const rows = [];
  for (const p of products) {
    if (p.status === 'inactivo' || p.kind !== 'consumible') continue;
    const st = consumptionStats(p.id, movements, { now });
    const stock = stockOf(p);
    const L = Math.max(0.5, Number(leadDays(p)) || 2);
    const ss = Math.ceil(z * st.sd * Math.sqrt(L));
    const rop = Math.max(Number(p.stockMin) || 0, Math.ceil(st.avgDaily * L + ss));
    const cover = st.avgDaily > 0 ? stock / st.avgDaily : Infinity;
    const target = Math.max(Number(p.stockMax) || 0, Math.ceil(rop + st.avgDaily * reviewDays));
    const pending = Number(onOrder[p.id]) || 0;
    const pack = Math.max(1, Number(p.packSize) || 1);
    let qty = stock + pending <= rop ? Math.max(0, target - stock - pending) : 0;
    qty = qty ? Math.ceil(qty / pack) * pack : 0;
    const unitCost = Number(p.lastPrice) || Number(p.avgCost) || 0;
    let level = 'ok';
    if (stock <= 0) level = 'agotado';
    else if (stock <= ss || cover < L) level = 'comprar_ya';
    else if (stock + pending <= rop) level = 'comprar_pronto';
    else if (cover > 45 && stock * unitCost > 200000) level = 'sobrestock';
    rows.push({
      productId: p.id, name: p.name, unit: p.unit, category: p.category, supplierId: p.supplierId || null,
      stock, avgDaily: round(st.avgDaily, 2), sd: round(st.sd, 2), leadDays: L, safetyStock: ss, reorderPoint: rop,
      cover: Number.isFinite(cover) ? round(cover, 1) : null, target, onOrder: pending, suggestedQty: qty,
      estCost: Math.round(qty * unitCost), unitCost, level,
      stockoutDate: Number.isFinite(cover) && st.avgDaily > 0 ? new Date(now + cover * DAYMS).toISOString().slice(0, 10) : null,
    });
  }
  const order = { agotado: 0, comprar_ya: 1, comprar_pronto: 2, sobrestock: 3, ok: 4 };
  return rows.sort((a, b) => order[a.level] - order[b.level] || (a.cover ?? 1e9) - (b.cover ?? 1e9));
}

/** Historial de precios de compra (entradas aprobadas con costo) */
function priceHistory(productId, movements) {
  return movements.filter((m) => m.productId === productId && m.type === 'entrada' && m.status === 'aprobado' && Number(m.unitCost) > 0)
    .sort((a, b) => new Date(a.ts) - new Date(b.ts)).map((m) => ({ ts: m.ts, price: Number(m.unitCost) }));
}

/**
 * Señales de compra y riesgo. Cada señal: {type, severity: alta|media|baja, productId, title, detail, value}
 */
function purchaseSignals({ products, movements, plan, recon = null, now = Date.now() }) {
  const out = [];
  const byId = Object.fromEntries(products.map((p) => [p.id, p]));
  for (const r of plan) {
    const p = byId[r.productId];
    if (r.level === 'agotado') out.push({ type: 'comprar_ya', severity: 'alta', productId: r.productId, title: `${r.name}: agotado`, detail: `Se consumen ${r.avgDaily} ${r.unit}/día. Pedir ${r.suggestedQty} ${r.unit}.`, value: r.estCost });
    else if (r.level === 'comprar_ya') out.push({ type: 'comprar_ya', severity: 'alta', productId: r.productId, title: `${r.name}: comprar hoy`, detail: `Quedan ${r.stock} ${r.unit} (≈${r.cover} días) y el proveedor tarda ${r.leadDays} días. Pedir ${r.suggestedQty} ${r.unit}.`, value: r.estCost });
    else if (r.level === 'comprar_pronto') out.push({ type: 'comprar_pronto', severity: 'media', productId: r.productId, title: `${r.name}: llegó al punto de reorden`, detail: `Stock ${r.stock} ≤ punto de reorden ${r.reorderPoint}. Se agotaría el ${r.stockoutDate}.`, value: r.estCost });
    else if (r.level === 'sobrestock') out.push({ type: 'sobrestock', severity: 'baja', productId: r.productId, title: `${r.name}: sobrestock`, detail: `Cubre ${r.cover} días de consumo. Evita comprar hasta bajar de ${r.reorderPoint}.`, value: Math.round(r.stock * r.unitCost) });

    // precio
    const ph = priceHistory(r.productId, movements);
    if (ph.length >= 3) {
      const last = ph[ph.length - 1].price;
      const prev = ph.slice(0, -1).slice(-5);
      const avg = prev.reduce((a, x) => a + x.price, 0) / prev.length;
      if (last > avg * 1.08) out.push({ type: 'alza_precio', severity: 'media', productId: r.productId, title: `${r.name}: subió ${Math.round((last / avg - 1) * 100)} %`, detail: `Última compra a $${Math.round(last)} vs. promedio $${Math.round(avg)}. Compara con otro proveedor.`, value: Math.round((last - avg) * (r.suggestedQty || r.avgDaily * 7)) });
      else if (last < avg * 0.93) out.push({ type: 'baja_precio', severity: 'baja', productId: r.productId, title: `${r.name}: precio a la baja`, detail: `Última compra ${Math.round((1 - last / avg) * 100)} % más barata. Buen momento para abastecer.`, value: 0 });
    }
    // consumo anómalo
    const st = consumptionStats(r.productId, movements, { now });
    if (st.avgAll >= 1 && st.last2 > st.avgAll + 2.5 * st.sd && st.last2 > st.avgAll * 1.8) out.push({ type: 'consumo_anomalo', severity: 'media', productId: r.productId, title: `${r.name}: consumo inusual`, detail: `${round(st.last2, 1)} ${r.unit}/día en los últimos 2 días frente a ${round(st.avgAll, 1)} habitual. Verifica si hay evento o fuga.`, value: 0 });
    // vencimiento
    if (p?.expiresAt && r.avgDaily > 0) {
      const daysLeft = (new Date(p.expiresAt) - now) / DAYMS;
      if (daysLeft > 0 && r.cover && r.cover > daysLeft) {
        const waste = Math.round(r.stock - r.avgDaily * daysLeft);
        if (waste > 0) out.push({ type: 'riesgo_vencimiento', severity: 'media', productId: r.productId, title: `${r.name}: ${waste} ${r.unit} podrían vencerse`, detail: `Vence el ${String(p.expiresAt).slice(0, 10)} y al ritmo actual no se alcanza a usar. Prioriza su salida.`, value: Math.round(waste * r.unitCost) });
      }
    }
  }
  // mermas (incluye menaje)
  for (const p of products) {
    if (p.status === 'inactivo') continue;
    const st = consumptionStats(p.id, movements, { days: 30, now });
    const rr = recon?.rows?.find((x) => x.productId === p.id);
    const missing = rr && rr.diferencia < 0 && ['importante', 'sin_respaldo'].includes(rr.status) ? -rr.diferencia : 0;
    if (st.losses >= 2 || missing) {
      const cost = Number(p.avgCost) || 0;
      out.push({ type: 'merma', severity: missing ? 'alta' : 'media', productId: p.id, title: missing && !st.losses ? `${p.name}: faltante en el conteo` : `${p.name}: merma recurrente`, detail: `${[st.lossQty ? `${st.lossQty} ${p.unit} dañados, perdidos o vencidos en 30 días` : '', missing ? `faltan ${missing} ${p.unit} en el último conteo` : ''].filter(Boolean).join(' y ').replace(/^./, (c) => c.toUpperCase())}. Revisa manipulación y responsables.`, value: Math.round((st.lossQty + missing) * cost) });
    }
  }
  const sev = { alta: 0, media: 1, baja: 2 };
  return out.sort((a, b) => sev[a.severity] - sev[b.severity] || (b.value || 0) - (a.value || 0));
}

/** Agrupa las cantidades sugeridas por proveedor para crear órdenes de compra */
function suggestedOrders(plan, suppliers = []) {
  const by = {};
  for (const r of plan) {
    if (!r.suggestedQty) continue;
    const k = r.supplierId || 'sin_proveedor';
    by[k] ||= { supplierId: r.supplierId, supplierName: suppliers.find((s) => s.id === r.supplierId)?.name || 'Sin proveedor asignado', items: [], total: 0, urgent: false };
    by[k].items.push({ productId: r.productId, name: r.name, qty: r.suggestedQty, unit: r.unit, unitCost: r.unitCost, subtotal: r.estCost, level: r.level });
    by[k].total += r.estCost;
    if (r.level === 'agotado' || r.level === 'comprar_ya') by[k].urgent = true;
  }
  return Object.values(by).sort((a, b) => Number(b.urgent) - Number(a.urgent) || b.total - a.total);
}

/**
 * Resumen compacto del estado para enviar a la IA (no incluye datos personales).
 * period: 'day' | 'week' | 'month'
 */
function buildDigest({ period = 'day', products, movements, purchases = [], expenses = [], recon = null, plan, signals, inbox = [], now = Date.now() }) {
  const days = { day: 1, week: 7, month: 30 }[period] || 1;
  const from = startOfDay(now) - (days - 1) * DAYMS;
  const prevFrom = from - days * DAYMS;
  const inRange = (t, a, b) => { const x = new Date(t).getTime(); return x >= a && x < b; };
  const byId = Object.fromEntries(products.map((p) => [p.id, p]));
  const agg = (a, b) => {
    const o = { entradas: 0, salidasValor: 0, marchados: 0, perdidasValor: 0, porProducto: {}, porArea: {}, porFuente: {} };
    for (const m of movements) {
      if (m.status !== 'aprobado' || !inRange(m.ts, a, b)) continue;
      const p = byId[m.productId]; if (!p) continue;
      const q = Number(m.qty) || 0, v = q * (Number(p.avgCost) || 0);
      o.porFuente[m.source] = (o.porFuente[m.source] || 0) + 1;
      if (MOVEMENT_TYPES[m.type]?.sign > 0 && m.type === 'entrada') o.entradas += v;
      if (OUT_TYPES.has(m.type)) {
        o.salidasValor += v;
        o.porProducto[p.name] = (o.porProducto[p.name] || 0) + q;
        if (m.area) o.porArea[m.area] = (o.porArea[m.area] || 0) + v;
        if (m.type === 'marchado' || m.type === 'cortesia') o.marchados += q;
        if (LOSS_TYPES.has(m.type)) o.perdidasValor += v;
      }
    }
    o.topProductos = Object.entries(o.porProducto).sort((x, y) => y[1] - x[1]).slice(0, 8).map(([n, q]) => ({ producto: n, unidades: round(q, 1) }));
    o.porArea = Object.fromEntries(Object.entries(o.porArea).map(([k, v]) => [k, Math.round(v)]));
    delete o.porProducto; o.entradas = Math.round(o.entradas); o.salidasValor = Math.round(o.salidasValor); o.perdidasValor = Math.round(o.perdidasValor);
    return o;
  };
  const end = startOfDay(now) + DAYMS;
  const cur = agg(from, end), prev = agg(prevFrom, from);
  const comp = purchases.filter((p) => p.status !== 'anulada' && inRange(p.purchasedAt, from, end));
  const gast = expenses.filter((e) => e.status !== 'anulado' && inRange(e.date, from, end));
  const gastCat = {}; for (const e of gast) gastCat[e.category] = (gastCat[e.category] || 0) + Number(e.amount);
  return {
    periodo: { tipo: period, desde: new Date(from).toISOString().slice(0, 10), hasta: new Date(end - 1).toISOString().slice(0, 10), moneda: 'COP' },
    operacion: { actual: cur, anterior: { salidasValor: prev.salidasValor, marchados: prev.marchados, perdidasValor: prev.perdidasValor } },
    compras: { total: Math.round(comp.reduce((a, p) => a + Number(p.total), 0)), facturas: comp.length, borradores: purchases.filter((p) => p.status === 'borrador').length },
    gastos: { total: Math.round(gast.reduce((a, e) => a + Number(e.amount), 0)), porCategoria: gastCat },
    inventario: {
      valor: Math.round(products.filter((p) => p.status !== 'inactivo').reduce((a, p) => a + Math.max(0, Number(p.stockCurrent ?? 0)) * (Number(p.avgCost) || 0), 0)) || undefined,
      agotados: plan.filter((r) => r.level === 'agotado').map((r) => r.name),
      comprarYa: plan.filter((r) => r.level === 'comprar_ya').map((r) => ({ producto: r.name, stock: r.stock, coberturaDias: r.cover, sugerido: r.suggestedQty })),
      puntoReorden: plan.filter((r) => r.level === 'comprar_pronto').map((r) => ({ producto: r.name, stock: r.stock, rop: r.reorderPoint })),
      sobrestock: plan.filter((r) => r.level === 'sobrestock').map((r) => ({ producto: r.name, coberturaDias: r.cover })),
      costoReposicionSugerida: plan.reduce((a, r) => a + r.estCost, 0),
    },
    conciliacion: recon ? { perdidaEstimada: recon.totals.perdida, sobrante: recon.totals.sobrante, conteos: recon.totals, peores: recon.rows.filter((r) => r.valor < 0).sort((a, b) => a.valor - b.valor).slice(0, 5).map((r) => ({ producto: r.name, diferencia: r.diferencia, valor: r.valor, estado: r.status })) } : null,
    senales: signals.slice(0, 15).map((s) => ({ tipo: s.type, severidad: s.severity, titulo: s.title, detalle: s.detail, valor: s.value })),
    whatsapp: { recibidos: inbox.filter((i) => inRange(i.ts, from, end)).length, pendientes: inbox.filter((i) => ['pendiente_aprobacion', 'requiere_info', 'pendiente_analisis'].includes(i.status)).length },
  };
}

${question ? `Además responde esta pregunta del administrador en "respuesta": ${question}\n` : ''}
Responde SOLO con JSON con esta forma:
{"titular": string (máx. 90 caracteres),
 "resumen": string (3-5 frases),

 "alertas": [{"titulo": string, "detalle": string, "prioridad": "alta"|"media"|"baja"}],

/** Resumen determinista (cuando no hay IA disponible). Misma forma que la respuesta de la IA. */
function ruleSummary(d) {
  const fmt = (v) => '$' + Math.round(v || 0).toLocaleString('es-CO');
  const a = d.operacion.actual, p = d.operacion.anterior;
  const var_ = p.salidasValor ? Math.round((a.salidasValor / p.salidasValor - 1) * 100) : null;
  const alta = d.senales.filter((s) => s.severidad === 'alta');
  const recs = [];
  if (d.inventario.comprarYa.length || d.inventario.agotados.length) recs.push({ titulo: 'Hacer pedido hoy', detalle: [...d.inventario.agotados, ...d.inventario.comprarYa.map((x) => x.producto)].slice(0, 6).join(', '), accion: 'Crear órdenes sugeridas en Inteligencia', impacto_cop: d.inventario.costoReposicionSugerida, prioridad: 'alta', modulo: 'compras' });
  if (d.conciliacion?.perdidaEstimada) recs.push({ titulo: 'Revisar faltantes del conteo', detalle: d.conciliacion.peores.map((x) => `${x.producto} (${x.diferencia})`).join(', '), accion: 'Abrir Conciliación y validar duplicados antes de ajustar', impacto_cop: d.conciliacion.perdidaEstimada, prioridad: 'alta', modulo: 'conciliacion' });
  for (const s of d.senales.filter((x) => x.tipo === 'alza_precio').slice(0, 2)) recs.push({ titulo: s.titulo, detalle: s.detalle, accion: 'Cotizar con otro proveedor', impacto_cop: s.valor, prioridad: 'media', modulo: 'compras' });
  for (const s of d.senales.filter((x) => x.tipo === 'merma').slice(0, 2)) recs.push({ titulo: s.titulo, detalle: s.detalle, accion: 'Hablar con el área responsable', impacto_cop: s.valor, prioridad: 'media', modulo: 'personal' });
  if (d.whatsapp.pendientes) recs.push({ titulo: `${d.whatsapp.pendientes} mensajes de WhatsApp sin revisar`, detalle: 'Hasta aprobarlos no afectan el inventario.', accion: 'Revisar la bandeja de WhatsApp', impacto_cop: null, prioridad: 'media', modulo: 'marchados' });
  return {
    titular: alta.length ? `${alta.length} alertas de alta prioridad · pérdida estimada ${fmt(d.conciliacion?.perdidaEstimada)}` : 'Operación estable en el periodo',
    resumen: `Salidas del periodo por ${fmt(a.salidasValor)} al costo${var_ !== null ? ` (${var_ >= 0 ? '+' : ''}${var_} % frente al periodo anterior)` : ''}. Compras por ${fmt(d.compras.total)} en ${d.compras.facturas} facturas y gastos por ${fmt(d.gastos.total)}. ${d.inventario.agotados.length} productos agotados y ${d.inventario.comprarYa.length} por comprar hoy; reponer cuesta cerca de ${fmt(d.inventario.costoReposicionSugerida)}.`,
    puntos_clave: [
      a.topProductos[0] ? `Lo más marchado: ${a.topProductos.slice(0, 3).map((x) => `${x.producto} (${x.unidades})`).join(', ')}` : 'Sin salidas registradas',
      `Mermas por ${fmt(a.perdidasValor)}`,
      d.conciliacion ? `Diferencias de conteo: ${fmt(d.conciliacion.perdidaEstimada)} en faltantes` : 'Sin conciliación reciente',
    ],
    alertas: alta.slice(0, 5).map((s) => ({ titulo: s.titulo, detalle: s.detalle, prioridad: 'alta' })),
    recomendaciones: recs,
    compras: d.inventario.comprarYa.length || d.inventario.agotados.length ? `Prioriza ${[...d.inventario.agotados.map((x) => `${x} (agotado)`), ...d.inventario.comprarYa.map((x) => `${x.sugerido} de ${x.producto}`)].slice(0, 5).join(', ')}.` : 'No hay compras urgentes.',
    preguntas_para_el_equipo: [],
    generadoPor: 'reglas',
  };
}

function round(v, d = 0) { const k = 10 ** d; return Math.round(v * k) / k; }

/* Roles y permisos de Capybara Control (backend + frontend).
 * ADMIN: todo. SUPERVISOR: opera y aprueba, sin configuración ni usuarios.

 * CAJERO: ingresa productos (entradas en borrador), factura, ve inventario y caja, envía a Alegra; sin tablero ni indicadores.
 * AUDITOR: solo lectura de todo, incluida la bitácora. */

const ROLES = {

  'entradas.crear': 'Registrar entradas (borrador)',
  'entradas.aprobar': 'Aprobar entradas de compra',

const DEFAULT_ROLE_PERMS = {

  // Cajero: ingresa productos (entradas en borrador), factura, verifica inventario y caja, y envía a Alegra. Sin indicadores ni costos.
  CAJERO: ['inventario.ver', 'entradas.crear', 'facturacion.crear', 'facturacion.emitir', 'caja.ver', 'alegra.enviar'],

};

/** ¿El rol tiene el permiso? `overrides` permite ajustar la matriz desde Control de acceso. */
function hasPerm(role, perm, overrides = null) {
  if (role === 'ADMIN') return true;
  const list = (overrides && overrides[role]) || DEFAULT_ROLE_PERMS[role] || [];
  return list.includes(perm);
}

/** Campos de dinero que se ocultan a quien no tiene costos.ver */
const MONEY_FIELDS = ['avgCost', 'lastPrice', 'unitCost', 'valorDisponible', 'subtotal', 'total', 'tax', 'discount', 'amount', 'valor', 'estCost', 'prices'];
function maskMoney(obj) {
  if (Array.isArray(obj)) return obj.map(maskMoney);
  if (!obj || typeof obj !== 'object' || obj instanceof Date) return obj;
  const o = {};
  for (const [k, v] of Object.entries(obj)) { if (MONEY_FIELDS.includes(k)) continue; o[k] = typeof v === 'object' ? maskMoney(v) : v; }
  return o;
}

/* =====================================================================
 * Capybara Control — importación de productos desde Excel / CSV / Sheets
 * (compartido por backend y frontend)

 *  findHeaderRow(matrix)        → detecta la fila de encabezados
 *  buildImportPlan({...})       → vista previa: nuevos, actualizaciones, sin cambios, errores
 * Reglas: las celdas vacías NUNCA borran datos; el stock de productos existentes no se
 * sobrescribe: se registra como conteo físico o como ajuste (trazabilidad).
 * ===================================================================== */
