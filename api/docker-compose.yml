services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: capybara
      POSTGRES_PASSWORD: capybara
      POSTGRES_DB: capybara_control
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capybara"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://capybara:capybara@db:5432/capybara_control?schema=public
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
    volumes: [uploads:/app/uploads]
volumes:
  pgdata:
  uploads:
